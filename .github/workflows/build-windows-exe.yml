name: Build TwinCallTracker.exe

# Builds the Windows executable on a real Windows runner, because PyInstaller
# bundles the interpreter and DLLs of the platform it runs on and cannot
# cross-compile from Linux.
#
# The finished .exe is attached to the run as a downloadable artifact, and also
# published as a GitHub Release when the run is started by hand.

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Also publish a GitHub Release with the .exe attached"
        type: boolean
        default: true
      version:
        description: "Version tag for the release (e.g. v1.2.0)"
        type: string
        default: "v1.2.0"
  push:
    branches: ["**"]
    paths:
      - "twin_call_tracker/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: twin_call_tracker
        shell: pwsh

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: twin_call_tracker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build the one-folder application
        run: python -m PyInstaller TwinCallTracker.spec --noconfirm --clean

      - name: Build the single-file application
        env:
          BUILD_ONEFILE: "1"
        run: |
          Move-Item -Path dist\TwinCallTracker -Destination dist\_onedir -Force
          python -m PyInstaller TwinCallTracker.spec --noconfirm --clean
          Move-Item -Path dist\_onedir -Destination dist\TwinCallTracker -Force

      - name: Confirm both executables exist
        run: |
          $folderExe = "dist\TwinCallTracker\TwinCallTracker.exe"
          $singleExe = "dist\TwinCallTracker.exe"
          if (-not (Test-Path $folderExe)) { throw "one-folder build is missing" }
          if (-not (Test-Path $singleExe)) { throw "one-file build is missing" }
          "One-folder: {0:N1} MB" -f ((Get-Item $folderExe).Length / 1MB)
          "One-file:   {0:N1} MB" -f ((Get-Item $singleExe).Length / 1MB)
          "Folder total: {0:N1} MB" -f (((Get-ChildItem dist\TwinCallTracker -Recurse |
              Measure-Object Length -Sum).Sum) / 1MB)

      - name: Smoke test - the .exe starts, migrates its database and writes a log
        run: |
          $env:TCT_DATA_DIR = "$env:RUNNER_TEMP\tct-smoke"
          New-Item -ItemType Directory -Force -Path $env:TCT_DATA_DIR | Out-Null
          $p = Start-Process -FilePath "dist\TwinCallTracker\TwinCallTracker.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "the application exited on its own with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          $log = Join-Path $env:TCT_DATA_DIR "logs\app.log"
          if (-not (Test-Path $log)) { throw "no log file was written - the app did not start" }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "Window shown" -Quiet)) {
            throw "the window never opened"
          }
          if (-not (Test-Path (Join-Path $env:TCT_DATA_DIR "sync_state.sqlite3"))) {
            throw "the database was not created"
          }
          "Smoke test passed."

      - name: Confirm the log contains no credentials
        run: |
          $log = Join-Path "$env:RUNNER_TEMP\tct-smoke" "logs\app.log"
          $bad = Select-String -Path $log -Pattern "access_token|refresh_token|client_secret|Bearer "
          if ($bad) { $bad; throw "the log contains something credential-shaped" }
          "Log is clean."

      - name: Package the one-folder build
        run: |
          Copy-Item README.md dist\TwinCallTracker\README.md
          Copy-Item .env.example dist\TwinCallTracker\.env.example
          Compress-Archive -Path dist\TwinCallTracker\* `
                           -DestinationPath dist\TwinCallTracker-windows-folder.zip -Force

      - name: Upload the one-folder build
        uses: actions/upload-artifact@v4
        with:
          name: TwinCallTracker-windows-folder
          path: twin_call_tracker/dist/TwinCallTracker-windows-folder.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload the single-file build
        uses: actions/upload-artifact@v4
        with:
          name: TwinCallTracker-windows-single-exe
          path: twin_call_tracker/dist/TwinCallTracker.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publish a release
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Twin Call Tracker ${{ inputs.version }}
          files: |
            twin_call_tracker/dist/TwinCallTracker.exe
            twin_call_tracker/dist/TwinCallTracker-windows-folder.zip
          body: |
            ## Downloads

            **`TwinCallTracker.exe`** — one single file. Download, double-click, done.
            Slower to start because it unpacks itself each launch, and Windows
            SmartScreen may warn the first time because it is not code-signed.

            **`TwinCallTracker-windows-folder.zip`** — unzip anywhere and run
            `TwinCallTracker.exe` inside. Starts faster. This is the recommended
            shape for everyday office use.

            ## Before the first run

            1. Put `client_secrets.json` from the Google Cloud console in
               `%LOCALAPPDATA%\TwinCallTracker\` — the README's *Google setup*
               section has the steps, and the app's About screen opens the folder
               for you.
            2. Share the spreadsheet with the Google account you will connect,
               giving it **Editor** access.
            3. Get your Monday.com API token: avatar → Developers → My access tokens.

            Then: open the app, connect both services, configure the board and
            sheet in Settings, and press **Refresh / Check for Updates**.

            Every build is tested before it is published: the full test suite runs,
            the executable is launched to confirm it starts and creates its
            database, and its log is checked to confirm no credentials leak into it.
