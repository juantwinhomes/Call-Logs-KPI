     12 August 2026. Every mail cost figure comes from the Red Stone Upload

      reference and never used to decide the Standard CRM Source.
   ========================================================================= */

const norm = s => (s||"").toLowerCase().replace(/[_\-./]+/g," ").replace(/\s+/g," ").trim();

function contactMethod(campaign, field){
  const n = norm(campaign);
  if (/\b(web ?form|website form|contact form|online form|form)\b/.test(n)) return "Web Form";
  if (/\b(inbound call|call in|called|phone|call)\b/.test(n))               return "Call";
  if (field === "Call" || field === "Web Form")                             return field;
  return null;
}
const FAMILIES = [
  [/\b(realtor|agent|broker|professional)\b[^|]*\bemail\b|\bemail\b[^|]*\b(realtor|agent|broker|professional)\b/,
                                     "Outbound Outreach","Outbound - Realtor Email",       "realtor email outreach"],
  [/\bcold ?call/,                   "Outbound Outreach","Outbound - Homeowner Cold Call", "cold call"],
  [/\b(sms|text blast|texting|smarter contact)\b/,
                                     "Outbound Outreach","Outbound - Homeowner Text",      "sms / text"],
  [/\boutbound\b|\bemail outreach\b|\bdrip\b/,
                                     "Outbound Outreach", null,                            "outbound marker"],
  [/\b(mls|redfin)\b/,               "MLS / Redfin","MLS / Redfin",                        "mls / redfin"],
  [/\bmotivated ?leads\b/,           "PPL","PPL - Motivated Leads",                        "motivated leads vendor"],
  [/\bproperty ?leads\b|\bppl\b/,    "PPL","PPL - Property Leads",                         "property leads vendor"],
  [/\bgoogle ?ads?\b|\badwords\b|\bgads\b/,
                                     "PPC","PPC - Google",                                 "google paid", true],
  [/\bbing\b|\bmicrosoft ?ads?\b|\bmsn\b/,
                                     "PPC","PPC - Bing",                                   "bing paid",   true],
  [/\b(tv|television|broadcast)\b/,  "TV","TV - Commercial",                               "television",  true],
  [/\bpost ?cards?\b/,               "Direct Mail","Direct Mail - Postcard",               "postcard"],
  [/\bletters?\b/,                   "Direct Mail","Direct Mail - Letter",                 "letter"],
  [/\bchecks?\b/,                    "Direct Mail","Direct Mail - Check",                  "check mailer"],
  [/\b(word of mouth|past client|friend|family|acquaintance|personal referral)\b/,
                                     "Referral","Referral - Personal / Word of Mouth",     "personal referral"],
  [/\b(realtor|agent|broker|attorney|professional)\b[^|]*\breferral\b|\breferral\b[^|]*\b(realtor|agent|broker|attorney)\b/,
                                     "Referral","Referral - Realtor / Professional",       "professional referral"],
  [/\bseo\b|\borganic\b/,            "Organic Search","Organic - SEO",                     "seo / organic", true],
  [/\breferral\b/,                   "Referral","Referral - Personal / Word of Mouth",     "bare referral"]
];
const UNMAPPED = [
  [/\b(facebook|fb|meta|instagram)\b/, "Facebook / Meta Ads"],
  [/\breddit\b/,                       "Reddit Ads"],
  [/\bppc\b|\bpaid search\b|\bcpc\b/,  "paid search with no platform named"],
  [/\bdirect mail\b|\bmailer\b/,       "direct mail with no format named"],
  [/\b(web ?form|contact form)\b/,     "web form with no channel named"]
];
function classify(campaign, methodField){
  const n = norm(campaign);
  if (!n) return {review:true, reason:"campaign is empty"};
  for (const [re, master, leaf, why, split] of FAMILIES){
    if (!re.test(n)) continue;
    if (!split){
      if (leaf) return {master, leaf, matchedOn:why, review:false};
      return {master, review:true, reason:"outbound channel not identified", matchedOn:why};
    }
    const m = contactMethod(campaign, methodField);
    if (!m) return {master, review:true,
                    reason:"contact method unknown — Call or Web Form", matchedOn:why};
    return {master, leaf:leaf + " - " + m, matchedOn:why + " + " + m.toLowerCase(), review:false};
  }
  for (const [re, label] of UNMAPPED)
    if (re.test(n)) return {review:true, reason:"no Standard CRM Source defined for " + label};
  return {review:true, reason:"no campaign signal"};
}

/* Manual overrides always win over auto-classification. */
const OVERRIDES = new Map();
try {
  const saved = localStorage.getItem("thb_source_overrides");
  if (saved) JSON.parse(saved).forEach(([k,v]) => OVERRIDES.set(k,v));
} catch(e){}
function persistOverrides(){
  try { localStorage.setItem("thb_source_overrides", JSON.stringify([...OVERRIDES])); } catch(e){}
}
function setOverride(id, leaf){ OVERRIDES.set(id, leaf); persistOverrides(); }
function clearOverrides(){ OVERRIDES.clear(); persistOverrides(); }

/* =========================================================================
   4. REAL DATA — the 2026 Call Logs folder.
      -------------------------------------------------------------------
      Read from the 32 weekly Google Sheets in "2026 Call Logs" on
      12 August 2026, taken from the .xlsx export so that every tab is
      visible. Nothing here is generated, estimated or modelled.

      TAB STRUCTURE. Each weekly workbook holds 11 to 13 tabs:
        Daily Calls Overview   the weekly summary blocks
        Campaigns              reference list
        Dispositions           reference list
        Date mailed            reference list, some weeks only
        one tab per day        e.g. 8.10, 8.11 ... — the per-call record
        Week                   a roll-up copy of the daily tabs

      This app counts the DAILY TABS. They are the primary per-call record:
      5,201 records across the 32 workbooks. The Week tab is a copy that runs
      short in 4 workbooks (5,164 in total against 5,201), so it is not used.

      Total Calls on screen is Inbound + Outbound, so those three figures always
      tie up: 5,193 for the year. The remaining 8 records are reported in their
      own tiles instead of being folded into the total — 3 whose Call Direction
      reads "Missed Call", and 5 where that column is blank.

      A row counts as a call when its Date cell holds a real date serial and at
      least one of Contact no. / Call Type / Call Disposition is filled in. That
      excludes 17 rows carrying a date and nothing else, which are layout
      residue rather than calls. A row's date comes from its own Date cell, never
      from the tab it sits on - one row inside tab 01.12 is dated 13 January.

      Columns, exactly as the daily tabs label them:
        Date · Start Time · Contact Name · Contact no. · Lead Source ·
        Campaign · Call Type · Caller Category · Lead Type ·
        Call Disposition · Lead Status · System Call Duration ·
        Talk Time · Wait Time · Agent Name · Address · Offer · Check no

      Lead Source is carried for reference only. The Standard CRM Source is

/* Expand the payload into records and classify each one. */
const DATA = (() => {
  const S=REAL.src, C=REAL.cmp, T=REAL.ct, K=REAL.cc, Y=REAL.lt, DS=REAL.dis, AG=REAL.ag,
        NM=REAL.nm, PH=REAL.ph;
  const recs = REAL.r.map((a,i) => {
    const campaign = C[a[3]] || "";
    const direction = T[a[4]] || "";
    /* The sheet records direction per call. An inbound call is a "Call"
       contact; an outbound follow-up says nothing about how the lead first
       arrived, so no method is inferred from it. */
    const method = direction === "Inbound Call" ? "Call" : null;
    return {
      id: "R-" + i,
      date: new Date(REAL.year, a[0]-1, a[1]),
      sheetSource: S[a[2]] || "",
      campaign,
      direction,
      callerType: K[a[5]] || "",
      status: Y[a[6]] || "",
      hasOffer: a[10] === 1,
      disposition: DS[a[7]] || "",
      agent: AG[a[8]] || "",
      /* Contact Name and Contact no. exactly as the sheet writes them. phoneId is
         the number reduced to its last 10 digits, which is what the unique-caller
         count uses, so formatting variants of one number do not count twice. */
      contact: NM[a[11]] || "",
      phone: PH[a[12]] || "",
      phoneId: a[9],
      auto: classify(campaign, method)
    };
  });
  recs.sort((x,y) => y.date - x.date);
  return {records:recs};
})();

function resolved(r){
  const ov = OVERRIDES.get(r.id);
  if (ov) return {master:MASTER_OF[ov] || null, leaf:ov, manual:true, review:false};
  return {master:r.auto.master || null, leaf:r.auto.leaf || null,
          manual:false, review:!!r.auto.review, reason:r.auto.reason};
}

/* Distinct values actually present, so nothing is hardcoded from memory. */
const VALUES = (() => {
  const g = f => [...new Set(DATA.records.map(r => r[f]).filter(Boolean))];
  return {directions:g("directions"), callerTypes:g("callerType"), statuses:g("status"),
          dispositions:g("disposition"), agents:g("agent"), sheetSources:g("sheetSource"),

})();

  "Confirmed Appointment","Rescheduled Appointment","Appointment Confirmed","Canceled Appointment"];

/* Months present in the real data. */
const MONTHS = (() => {
  const keys = [...new Set(DATA.records.map(r => mKey(r.date)))].sort();
  return keys.map(k => {
    const [y,m] = k.split("-").map(Number);
    return {y, m:m-1, key:k};
  });
})();

/* =========================================================================
   5. PERIODS
   ========================================================================= */

const state = {
  master: ALL_MASTERS, leaf: ALL_LEAF,
  month: "All Months", day: ALL_DAYS, calOpen: false, compare: "Previous Month",
  customFrom:"2026-07-01", customTo:"2026-07-31",
  page:"dashboard",
  srcSort:{col:"calls", dir:-1}, srcQuery:"", srcView:"master",
  reviewPage:1, logPage:1, dispSort:"count",
  logQ:"", logDir:"", logCC:"", logLT:"", logDis:"", logAg:""
};

const dayMs = 86400000;
const startOfMonth = (y,m) => new Date(y, m, 1);
const endOfMonth   = (y,m) => new Date(y, m+1, 0);
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const iso = (d) => d.toISOString().slice(0,10);
/* Day keys are built from the local calendar parts, not through toISOString():
   a date created as local midnight is the previous day in UTC for anyone east
   of Greenwich, which would silently shift every day filter by one. */
const dkey = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                    + "-" + String(d.getDate()).padStart(2,"0");
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* Calls per calendar day, counted once from every record. Used to label the day
   picker so an empty day is visible before it is chosen. Deliberately not
   filtered by source: the labels would then change as the source filter moved,
   which is the same convention the month picker already follows. */
let DAY_COUNTS = null;
function dayCounts(){
  if (DAY_COUNTS) return DAY_COUNTS;
  DAY_COUNTS = {};
  // Counts Inbound + Outbound, the same thing the Total Calls tile counts, so a
  // date cannot promise "2 calls" on hover and then report 0 once clicked. Two
  // records on 12 August have no Call Direction at all; the calendar therefore
  // shows that day as having no calls, and the Direction Not Recorded tile is
  // where those two are accounted for.
  DATA.records.forEach(r => {
    if (r.direction !== DIR_INBOUND && r.direction !== DIR_OUTBOUND) return;
    const k = dkey(r.date);
    DAY_COUNTS[k] = (DAY_COUNTS[k] || 0) + 1;
  });
  return DAY_COUNTS;
}

function dayOptions(){
  if (state.month === "All Months") return [];
  const [y,m] = state.month.split("-").map(Number);
  const last = endOfMonth(y,m-1).getDate(), counts = dayCounts(), out = [];
  for (let d = 1; d <= last; d++){
    const dt = new Date(y, m-1, d), key = dkey(dt);
    out.push({key, label:`${DOW[dt.getDay()]} ${String(d).padStart(2,"0")}`,
              calls:counts[key] || 0, future: dt > TODAY});
  }
  return out;
}

/* A day only stands while its own month is selected. */
function selectedDay(){
  if (state.month === "All Months" || state.day === ALL_DAYS) return null;
  return state.day.startsWith(state.month + "-") ? state.day : null;
}

function monthOptions(){
  const withData = new Set(DATA.records.map(r => mKey(r.date)));
  const out = ["All Months"];
  for (let m = 0; m < 12; m++){
    const key = REPORT_YEAR + "-" + String(m+1).padStart(2,"0");
    out.push({label:`${MONTH_NAMES[m]} ${REPORT_YEAR}`, key,
              hasData:withData.has(key),
              partial:withData.has(key) && endOfMonth(REPORT_YEAR,m) >= TODAY});
  }
  return out;
}
function selectedMonthPartial(){
  if (state.month === "All Months" || selectedDay()) return false;   // a day is never partial
  const m = monthOptions().find(o => o !== "All Months" && o.key === state.month);
  return !!(m && m.partial);
}
function currentRange(){
  const day = selectedDay();
  if (day){
    const d = new Date(day + "T00:00:00");
    return {from:d, to:d, isDay:true,
            label:`${DOW[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`};
  }
  if (state.month === "All Months")
    return {from:startOfMonth(REPORT_YEAR,0), to:endOfMonth(REPORT_YEAR,11),
            label:`All Months ${REPORT_YEAR}`};
  const [y,m] = state.month.split("-").map(Number);
  return {from:startOfMonth(y,m-1), to:endOfMonth(y,m-1), label:`${MONTH_NAMES[m-1]} ${y}`};
}
const dayLabel = (d) =>
  `${DOW[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;

/* One calendar day, clamped into a month that may be shorter: comparing 31 March
   with "the same date last month" has to land on 28 February, not 3 March. */
function sameDateIn(y, m, day){
  const last = endOfMonth(y,m).getDate();
  return new Date(y, m, Math.min(day, last));
}
function compareRange(cur){
  // Guard rather than fall through: without a day selected this mode has no
  // meaning, and the day-count branch below would silently treat it as 90 days.
  const mode = (state.compare === PREVIOUS_DAY && !cur.isDay) ? "Previous Month" : state.compare;
  /* With a single day selected every comparison stays one day wide, so the
     figures beside it are like for like instead of a day against a month. */
  if (cur.isDay){
    const c = cur.from;
    if (mode === "Custom Period"){
      const f = new Date(state.customFrom + "T00:00:00"), t = new Date(state.customTo + "T00:00:00");
      if (isNaN(f) || isNaN(t) || f > t) return null;
      return {from:f, to:t, label:`${iso(f)} to ${iso(t)}`};
    }
    if (mode === "Previous Day"){
      const p = addDays(c, -1);
      return {from:p, to:p, label:dayLabel(p)};
    }
    if (mode === "Previous Month"){
      const p = sameDateIn(c.getFullYear(), c.getMonth()-1, c.getDate());
      return {from:p, to:p, label:dayLabel(p)};
    }
    if (mode === "Same Month Last Year"){
      const p = sameDateIn(c.getFullYear()-1, c.getMonth(), c.getDate());
      return {from:p, to:p, label:dayLabel(p),
              note:"the call logs only cover 2026, so last year has no data"};
    }
    const n = mode === "Previous 30 Days" ? 30 : mode === "Previous 60 Days" ? 60 : 90;
    const to = addDays(c, -1);
    return {from:addDays(to, -(n-1)), to, label:`${n} days to ${iso(to)}`,
            note:`${n} days against one day — compare the daily average, not the total`};
  }
  if (mode === "Custom Period"){
    const f = new Date(state.customFrom + "T00:00:00"), t = new Date(state.customTo + "T00:00:00");
    if (isNaN(f) || isNaN(t) || f > t) return null;
    return {from:f, to:t, label:`${iso(f)} to ${iso(t)}`};
  }
  if (mode === "Previous Month"){
    if (state.month === "All Months")
      return {from:startOfMonth(REPORT_YEAR-1,0), to:endOfMonth(REPORT_YEAR-1,11),
              label:`All Months ${REPORT_YEAR-1}`,
              note:"previous month is undefined for All Months — comparing with the prior year, which has no call-log data"};
    const p = new Date(cur.from.getFullYear(), cur.from.getMonth()-1, 1);
    return {from:startOfMonth(p.getFullYear(),p.getMonth()), to:endOfMonth(p.getFullYear(),p.getMonth()),
            label:`${MONTH_NAMES[p.getMonth()]} ${p.getFullYear()}`};
  }
  if (mode === "Same Month Last Year"){
    const y = cur.from.getFullYear()-1;
    if (state.month === "All Months")
      return {from:startOfMonth(y,0), to:endOfMonth(y,11), label:`All Months ${y}`,
              note:"the call logs only cover 2026, so last year has no data"};
    return {from:startOfMonth(y,cur.from.getMonth()), to:endOfMonth(y,cur.from.getMonth()),
            label:`${MONTH_NAMES[cur.from.getMonth()]} ${y}`,
            note:"the call logs only cover 2026, so last year has no data"};
  }
  const n = mode === "Previous 30 Days" ? 30 : mode === "Previous 60 Days" ? 60 : 90;
  const to = addDays(cur.from, -1);
  return {from:addDays(to, -(n-1)), to, label:`${n} days to ${iso(to)}`};
}

/* =========================================================================
   6. AGGREGATE — counted from the real records, nothing derived by formula
      except the mail cost ratios, which divide real cost by real counts.
   ========================================================================= */

const safeDiv = (a,b) => (b && isFinite(a/b)) ? a/b : null;
const inRange = (d,r) => d >= r.from && d <= r.to;

function monthKeysIn(range){
  const out = [];
  for (let y = range.from.getFullYear(); y <= range.to.getFullYear(); y++)
    for (let m = 0; m < 12; m++){
      const s = startOfMonth(y,m), e = endOfMonth(y,m);
      if (e >= range.from && s <= range.to) out.push(y + "-" + String(m+1).padStart(2,"0"));
    }
  return out;
}
function monthOverlapFraction(monthKey, range){
  const [y,m] = monthKey.split("-").map(Number);
  const s = startOfMonth(y,m-1), e = endOfMonth(y,m-1);
  const from = range.from > s ? range.from : s, to = range.to < e ? range.to : e;
  if (to < from) return 0;
  return Math.min(1, (Math.round((to - from)/dayMs) + 1) / e.getDate());
}
function scopeLeaves(master, leaf){
  if (Array.isArray(leaf)) return leaf.slice();
  if (master === ALL_MASTERS) return ALL_LEAVES.concat([NEEDS_REVIEW]);
  if (master === NEEDS_REVIEW) return [NEEDS_REVIEW];
  const subs = TAXONOMY[master] || [];
  if (leaf === ALL_LEAF || !leaf) return subs.slice();
  return subs.includes(leaf) ? [leaf] : subs.slice();
}

/* Mail cost and piece count. A figure is only produced when every leaf in
   scope has supplied data, so a partial total is never shown as a real one. */
function suppliedCost(range, master, leaf){
  const leaves = scopeLeaves(master, leaf).filter(l => l !== NEEDS_REVIEW);
  if (!leaves.length || !leaves.every(leafCosted))
    return {cost:null, pieces:null, jobs:0, estimated:0};
  let cost = 0, pieces = 0, jobs = 0, estimated = 0;
  leaves.forEach(l => (COSTING[l].jobs || []).forEach(j => {
    const d = jobDate(j);
    if (d.date < range.from || d.date > range.to) return;
    cost += j.cost; pieces += j.qty; jobs++;
    if (d.estimated) estimated++;
  }));
  return {cost, pieces, jobs, estimated};
}

function aggregate(range, master, leaf){
  const scope = new Set(scopeLeaves(master, leaf));
  const a = {
    records:0, calls:0, inbound:0, outbound:0, missed:0, dirNotRecorded:0,
    firstTime:0, repeat:0, followUp:0, ctNotRecorded:0,
    review:0, manual:0,
    status:{}, disposition:{}, appt:{}, apptTotal:0, apptBooked:0,
    phones:new Set()
  };
  APPT_DISPOSITIONS.forEach(d => { a.appt[d] = 0; });

  DATA.records.forEach(r => {
    if (!inRange(r.date, range)) return;
    const res = resolved(r);
    if (!scope.has(res.leaf || NEEDS_REVIEW)) return;
    a.records++;
    if (res.review) a.review++;
    if (res.manual) a.manual++;
    if (r.direction === DIR_INBOUND) a.inbound++;
    else if (r.direction === DIR_OUTBOUND) a.outbound++;
    else if (r.direction === DIR_MISSED) a.missed++;
    else a.dirNotRecorded++;
    if (r.callerType === "First Time Caller") a.firstTime++;
    else if (r.callerType === "Repeat Caller") a.repeat++;
    else if (r.callerType === "Follow Up Responder") a.followUp++;
    else a.ctNotRecorded++;
    if (r.status)      a.status[r.status] = (a.status[r.status] || 0) + 1;
    if (r.disposition) a.disposition[r.disposition] = (a.disposition[r.disposition] || 0) + 1;
    if (r.disposition in a.appt){ a.appt[r.disposition]++; a.apptTotal++; }
    if (r.disposition === "Appointment Booked (H)") a.apptBooked++;
    a.phones.add(r.phoneId);
  });

  /* Total Calls is Inbound + Outbound, so the three figures always tie up on
     screen. The remainder of the records - a Call Direction of "Missed Call",
     or that column left blank - are reported in their own tiles rather than
     folded into the total, so nothing is dropped: records = calls + missed +
     dirNotRecorded, always. Across 2026 that is 5,193 calls out of 5,201
     records: 3 missed and 3 with no direction recorded. */
  a.calls = a.inbound + a.outbound;

  const c = suppliedCost(range, master, leaf);
  a.uniquePhones = a.phones.size;
  a.mailKnown = c.cost !== null;
  a.spend  = c.cost;
  a.mailed = c.pieces;
  a.jobs = c.jobs; a.estimatedJobs = c.estimated;
  a.costPerPiece      = a.mailKnown && c.pieces > 0 ? c.cost / c.pieces : null;
  a.costPerInboundCall= a.mailKnown && c.cost > 0 && a.inbound > 0 ? c.cost / a.inbound : null;
  a.costPerCall       = a.mailKnown && c.cost > 0 && a.calls   > 0 ? c.cost / a.calls   : null;
  /* Inbound calls per 1,000 pieces mailed — a rate the sheets support. */
  a.inboundPerK       = a.mailKnown && c.pieces > 0 ? a.inbound / c.pieces * 1000 : null;
  a.inboundRate       = a.calls > 0 ? a.inbound / a.calls * 100 : null;
  a.apptPerCall       = a.calls > 0 ? a.apptBooked / a.calls * 100 : null;

  /* Direct-mail pipeline stages from the monday.com board. The board covers
     direct mail only, so a stage count is produced only when every Standard
     CRM Source in scope is one the board carries. Anywhere else the cards say
     the board holds nothing, rather than showing a zero.
     The period filter runs on Date Received, because that is the only date the
     board records — Lead Stage carries no timestamp of its own. */
  const dmLeaves = scopeLeaves(master, leaf).filter(l => l !== NEEDS_REVIEW);
  a.dmKnown = dmLeaves.length > 0 && dmLeaves.every(l => DM_COVERED_LEAVES.has(l));
  a.dmStage = {};
  DM_STAGES.forEach(st => { a.dmStage[st] = a.dmKnown ? 0 : null; });
  a.dmItems = a.dmKnown ? 0 : null;
  a.dmUndated = 0;
  a.dmRevenue = null; a.dmRevenueRows = 0;
  if (a.dmKnown){
    const set = new Set(dmLeaves);
    DM_ITEMS.forEach(it => {
      if (!it.leaf || !set.has(it.leaf)) return;
      if (!it.date){ a.dmUndated++; return; }
      if (!inRange(it.date, range)) return;
      a.dmItems++;
      a.dmStage[it.stage]++;
      if (it.revenue !== null){
        a.dmRevenue = (a.dmRevenue || 0) + it.revenue;
        a.dmRevenueRows++;
      }
    });
  }
  /* Revenue as the board holds it. It sits on the item, so it is counted into
     the period of that item's Date Received like every other board figure.
     dmRevenueRows carries how many items it came from, so the screen can say
     what share of the acquisitions it covers instead of implying all of them. */
  a.dmAcqWithRevenue = a.dmKnown ? 0 : null;
  if (a.dmKnown){
    const set2 = new Set(dmLeaves);
    DM_ITEMS.forEach(it => {
      if (!it.leaf || !set2.has(it.leaf) || !it.date || !inRange(it.date, range)) return;
      if (it.stage === "Acquired" && it.revenue !== null) a.dmAcqWithRevenue++;
    });
  }
  a.dmAcquired      = a.dmKnown ? a.dmStage["Acquired"]           : null;
  a.dmCancelled     = a.dmKnown ? a.dmStage["Cancelled Contract"] : null;
  a.dmUnderContract = a.dmKnown ? a.dmStage["Under Contract"]     : null;
  a.dmAppointment   = a.dmKnown ? a.dmStage["Appointment"]        : null;
  a.dmDead          = a.dmKnown ? a.dmStage["Dead"]               : null;
  return a;
}

/* =========================================================================
   7. FORMATTING
   ========================================================================= */

const DASH = "—";
function fmt(v, kind){
  if (v === null || v === undefined || (typeof v === "number" && !isFinite(v))) return DASH;
  switch(kind){
    case "int":  return Math.round(v).toLocaleString("en-US");
    case "usd0": return "$" + Math.round(v).toLocaleString("en-US");
    case "usd2": return v >= 100 ? "$" + Math.round(v).toLocaleString("en-US") : "$" + v.toFixed(2);
    case "pct":  return v.toFixed(1) + "%";
    case "pct1": return v.toFixed(1) + "%";
    case "pct2": return v.toFixed(2) + "%";
    case "dec2": return v.toLocaleString("en-US",{maximumFractionDigits:2});
    case "dec1": return v.toLocaleString("en-US",{maximumFractionDigits:1});
    default:     return String(v);
  }
}
function compactUSD(v){
  if (v === null) return DASH;
  const a = Math.abs(v);
  if (a >= 1e6) return "$" + (v/1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + Math.round(v/1e3) + "k";
  return "$" + Math.round(v);
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ARROW_UP   = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M4.5 1L8 6.5H1z" fill="currentColor"/></svg>';
const ARROW_DOWN = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M4.5 8L1 2.5h7z" fill="currentColor"/></svg>';
const DOT_FLAT   = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><rect x="1" y="4" width="7" height="1.6" fill="currentColor"/></svg>';
const ICON_CLOCK = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 2.7V5l1.8 1.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
const ICON_INFO  = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v5M8 4.6v.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const ICON_WARN  = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l6.2 11.4H1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2v3.4M8 11.4v.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

function notice(kind, html, raw){
  return `<div class="notice ${kind}" role="note">${kind === "warn" ? ICON_WARN : ICON_INFO}<div>${
    raw ? html : "<p>" + html + "</p>"}</div></div>`;
}

function deltaChip(cur, prev, dir){
  if (cur === null || prev === null) return '<span class="chip none">no comparison</span>';
  if (prev === 0 && cur === 0)      return '<span class="chip flat">' + DOT_FLAT + ' no change</span>';
  /* A prior period of zero has no percentage baseline — dividing by it would
     read as infinite growth. The absolute change on the line below carries the
     magnitude instead, so this must not claim "no prior data" while the same
     card shows "prev $0". */
  if (prev === 0){
    const tone = dir === "down" ? "bad" : dir === "up" ? "good" : "flat";
    return `<span class="chip ${tone}">${ARROW_UP} new</span>`;
  }
  const pct = (cur - prev) / Math.abs(prev) * 100;
  const rose = cur > prev, fell = cur < prev;
  let tone = "flat";
  if (dir === "up")   tone = rose ? "good" : fell ? "bad" : "flat";
  if (dir === "down") tone = fell ? "good" : rose ? "bad" : "flat";
  return `<span class="chip ${tone}">${rose ? ARROW_UP : fell ? ARROW_DOWN : DOT_FLAT} ${
    pct > 0 ? "+" : ""}${pct.toFixed(2)}%</span>`;
}
function absDelta(cur, prev, kind){
  if (cur === null || prev === null) return "";
  const d = cur - prev;
  return (d > 0 ? "+" : d < 0 ? "−" : "") + fmt(Math.abs(d), kind).replace("-","");
}
function kpiCard(def, A, B){
  const cur = A[def.key], prev = B ? B[def.key] : null;
  /* Mail piece counts and cost ratios exist only where the Red Stone board has
     data. Where it does not, the card says so rather than showing a zero. */
  if (MAIL_KPI_KEYS.has(def.key) && !A.mailKnown){
    return `<article class="kpi">
      <p class="kpi-title">${esc(def.title)}</p>
      <p class="kpi-value empty">${DASH}</p>
      <div class="kpi-foot"><span class="chip flat">${ICON_CLOCK} no mail data</span>
        <p class="kpi-prev">not on the Red Stone board</p></div></article>`;
  }
  /* Pipeline stages exist only on the direct-mail board. */
  if (DM_KPI_KEYS.has(def.key) && !A.dmKnown){
    return `<article class="kpi">
      <p class="kpi-title">${esc(def.title)}</p>
      <p class="kpi-value empty">${DASH}</p>
      <div class="kpi-foot"><span class="chip flat">${ICON_CLOCK} no board data</span>
        <p class="kpi-prev">the direct-mail board covers direct mail only</p></div></article>`;
  }
  return `<article class="kpi">
    <p class="kpi-title">${esc(def.title)}</p>
    <p class="kpi-value${cur === null || cur === undefined ? " empty" : ""}">${fmt(cur, def.fmt)}</p>
    <div class="kpi-foot">${deltaChip(cur, prev, def.dir)}
      <p class="kpi-prev">prev ${fmt(prev, def.fmt)}${
        prev !== null && prev !== undefined && cur !== null && cur !== undefined
          ? " · " + absDelta(cur, prev, def.fmt) : ""}</p>
    </div></article>`;
}
function statTile(title, value, sub){
  return `<article class="kpi"><p class="kpi-title">${esc(title)}</p>
    <p class="kpi-value">${value}</p>
    ${sub ? `<p class="kpi-prev">${esc(sub)}</p>` : ""}</article>`;
}

/* =========================================================================
   8. CHARTS — hand-drawn SVG, no external library.
   ========================================================================= */

const tip = document.getElementById("tip");
let tipRAF = null;
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.opacity = "1"; tip.setAttribute("aria-hidden","false");
  if (tipRAF) cancelAnimationFrame(tipRAF);
  tipRAF = requestAnimationFrame(() => {
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 10;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (left < 8) left = 8;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  });
}
function hideTip(){ tip.style.opacity = "0"; tip.setAttribute("aria-hidden","true"); }
document.addEventListener("scroll", hideTip, true);

function niceStep(rough){
  if (!isFinite(rough) || rough <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(rough))), n = rough / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function axisScale(vals, ticks){
  ticks = ticks || 4;
  const clean = vals.filter(v => v !== null && isFinite(v));
  const hi = Math.max(...clean, 0), lo = Math.min(...clean, 0);
  if (hi === 0 && lo === 0) return {min:0, max:1, step:0.25};
  if (lo >= 0){ const step = niceStep(hi*1.08/ticks); return {min:0, max:step*ticks, step}; }
  const step = niceStep((hi-lo)*1.08/ticks);
  const min = Math.floor(lo/step)*step;
  let max = min + step*ticks;
  while (max < hi) max += step;
  return {min, max, step};
}
function tickValues(sc){
  const out = [], n = Math.round((sc.max - sc.min)/sc.step);
  for (let i = 0; i <= n; i++) out.push(sc.min + sc.step*i);
  return out;
}
const SVG_NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent){
  const n = document.createElementNS(SVG_NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function barPath(x,y,w,h,r){
  r = Math.min(r, w/2, h);
  if (h <= 0.6) return `M${x} ${y+h} h${w}`;
  return `M${x} ${y+h} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h} Z`;
}
const CHART_PAD = {t:16, r:14, b:30, l:52};
function axisFmt(v, kind){
  if (kind === "usd0" || kind === "usd2") return compactUSD(v);
  if (kind === "pct" || kind === "pct2")  return Math.round(v) + "%";
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v % 1000 === 0 ? 0 : 1) + "k";
  return String(Math.round(v));
}
function emptyChart(host, msg, height){
  const W = Math.max(host.clientWidth || 520, 300), H = height || 210;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":msg}, host);
  el("rect", {x:1,y:1,width:W-2,height:H-2,rx:8,fill:"var(--surface-2)",
    stroke:"var(--rule-soft)","stroke-dasharray":"4 4"}, svg);
  const t = el("text", {x:W/2,y:H/2-2,"text-anchor":"middle",fill:"var(--ink-3)","font-size":13}, svg);
  t.textContent = msg;
  const t2 = el("text", {x:W/2,y:H/2+18,"text-anchor":"middle",fill:"var(--ink-3)","font-size":11.5}, svg);
  t2.textContent = "nothing plotted — this is not a value of zero";
  return svg;
}
const allNull = s => s.every(x => x.values.every(v => v === null));

function columnChart(host, opts){
  const {labels, series, kind="int", highlight=-1, height=210} = opts;
  if (allNull(series)) return emptyChart(host, opts.emptyMsg || "No data to plot", height);
  const W = Math.max(host.clientWidth || 520, 300), H = height, p = CHART_PAD;
  const innerW = W-p.l-p.r, innerH = H-p.t-p.b;
  const sc = axisScale(series.flatMap(s => s.values));
  const span = sc.max - sc.min || 1;
  const yOf = v => p.t + innerH - (v - sc.min)/span*innerH;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria||"chart"}, host);
  tickValues(sc).forEach(v => {
    const y = yOf(v);
    el("line", {x1:p.l,x2:W-p.r,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}, svg);
    const t = el("text", {x:p.l-9,y:y+4,"text-anchor":"end",fill:"var(--ink-3)",
      "font-size":11,"font-family":"var(--mono)"}, svg);
    t.textContent = axisFmt(v, kind);
  });
  const zeroY = yOf(Math.max(sc.min,0));
  el("line", {x1:p.l,x2:W-p.r,y1:zeroY,y2:zeroY,stroke:"var(--axis)","stroke-width":1}, svg);
  const n = labels.length, slot = innerW/n;
  const groupW = Math.min(slot*0.66, 46), gap = 2;
  const barW = series.length > 1 ? Math.max(3,(groupW-gap*(series.length-1))/series.length) : groupW;
  labels.forEach((lab,i) => {
    const gx = p.l + slot*i + (slot-groupW)/2;
    if (i === highlight)
      el("rect", {x:p.l+slot*i+1,y:p.t-6,width:slot-2,height:innerH+8,fill:"#eff4fa",rx:6}, svg);
    series.forEach((s,si) => {
      const v = s.values[i];
      if (v === null) return;
      const x = gx + si*(barW+gap), y1 = yOf(v);
      const top = Math.min(zeroY,y1), h = Math.abs(y1-zeroY);
      const path = el("path", {d:barPath(x,top,barW,h,4), fill:s.color,
        opacity: highlight === -1 || i === highlight ? 1 : .55}, svg);
      path.addEventListener("mouseenter", ev => showTip(
        `<div class="tip-t">${esc(lab)}</div>` + series.map(ss => ss.values[i] === null ? "" :
          `<div class="tip-r"><i style="background:${ss.color}"></i>${esc(ss.name)}<b>${fmt(ss.values[i],kind)}</b></div>`
        ).join(""), ev.clientX, ev.clientY));
      path.addEventListener("mousemove", ev => showTip(tip.innerHTML, ev.clientX, ev.clientY));
      path.addEventListener("mouseleave", hideTip);
    });
    const thin = n > 8 && innerW/n < 46;
    if (!thin || i % 2 === 0 || i === highlight){
      const t = el("text", {x:p.l+slot*i+slot/2,y:H-10,"text-anchor":"middle",
        fill: i === highlight ? "var(--ink)" : "var(--ink-3)","font-size":11,
        "font-weight": i === highlight ? 700 : 400}, svg);
      t.textContent = lab;
    }
  });
  if (highlight >= 0 && series.length === 1 && series[0].values[highlight] !== null){
    const v = series[0].values[highlight];
    const t = el("text", {x:p.l+slot*highlight+slot/2,y:yOf(v)-8,"text-anchor":"middle",
      fill:"var(--ink)","font-size":12,"font-weight":700}, svg);
    t.textContent = fmt(v, kind);
  }
  return svg;
}

function lineChart(host, opts){
  const {labels, series, kind="int", height=210, highlight=-1} = opts;
  if (allNull(series)) return emptyChart(host, opts.emptyMsg || "No data to plot", height);
  const W = Math.max(host.clientWidth || 520, 300), H = height, p = CHART_PAD;
  const innerW = W-p.l-p.r, innerH = H-p.t-p.b;
  const sc = axisScale(series.flatMap(s => s.values));
  const span = sc.max - sc.min || 1, n = labels.length;
  const xOf = i => p.l + (n === 1 ? innerW/2 : innerW*i/(n-1));
  const yOf = v => p.t + innerH - (v - sc.min)/span*innerH;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria||"trend"}, host);
  tickValues(sc).forEach(v => {
    const y = yOf(v);
    el("line", {x1:p.l,x2:W-p.r,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}, svg);
    const t = el("text", {x:p.l-9,y:y+4,"text-anchor":"end",fill:"var(--ink-3)",
      "font-size":11,"font-family":"var(--mono)"}, svg);
    t.textContent = axisFmt(v, kind);
  });
  if (sc.min < 0)
    el("line", {x1:p.l,x2:W-p.r,y1:yOf(0),y2:yOf(0),stroke:"var(--axis)",
      "stroke-width":1,"stroke-dasharray":"3 3"}, svg);
  series.forEach(s => {
    let d = "", open = false;
    s.values.forEach((v,i) => {
      if (v === null){ open = false; return; }
      d += (open ? " L" : " M") + xOf(i) + " " + yOf(v); open = true;
    });
    if (d) el("path", {d:d.trim(),fill:"none",stroke:s.color,"stroke-width":2,
      "stroke-linejoin":"round","stroke-linecap":"round"}, svg);
    const last = s.values.reduce((a,v,i) => v !== null ? i : a, -1);
    if (last >= 0) el("circle", {cx:xOf(last),cy:yOf(s.values[last]),r:4.5,fill:s.color,
      stroke:"var(--surface)","stroke-width":2}, svg);
  });
  labels.forEach((lab,i) => {
    const thin = n > 8 && innerW/n < 46;
    if (!thin || i % 2 === 0 || i === highlight){
      const t = el("text", {x:xOf(i),y:H-10,"text-anchor":"middle",
        fill: i === highlight ? "var(--ink)" : "var(--ink-3)","font-size":11,
        "font-weight": i === highlight ? 700 : 400}, svg);
      t.textContent = lab;
    }
  });
  const cross = el("line", {y1:p.t,y2:p.t+innerH,stroke:"var(--axis)","stroke-width":1,opacity:0}, svg);
  const dots = series.map(s => el("circle", {r:5,fill:s.color,stroke:"var(--surface)",
    "stroke-width":2,opacity:0}, svg));
  const hit = el("rect", {x:p.l,y:p.t,width:innerW,height:innerH,fill:"transparent"}, svg);
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX - box.left)/box.width*W;
    let i = Math.round((rel - p.l)/(innerW/Math.max(1,n-1)));
    i = Math.max(0, Math.min(n-1, i));
    if (series.every(s => s.values[i] === null)){
      hideTip(); cross.setAttribute("opacity",0); dots.forEach(d => d.setAttribute("opacity",0)); return;
    }
    cross.setAttribute("x1",xOf(i)); cross.setAttribute("x2",xOf(i)); cross.setAttribute("opacity",1);
    series.forEach((s,si) => {
      if (s.values[i] === null){ dots[si].setAttribute("opacity",0); return; }
      dots[si].setAttribute("cx",xOf(i)); dots[si].setAttribute("cy",yOf(s.values[i]));
      dots[si].setAttribute("opacity",1);
    });
    showTip(`<div class="tip-t">${esc(labels[i])}</div>` + series.map(s => s.values[i] === null ? "" :
      `<div class="tip-r"><i style="background:${s.color}"></i>${esc(s.name)}<b>${fmt(s.values[i],kind)}</b></div>`
    ).join(""), ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => {
    hideTip(); cross.setAttribute("opacity",0); dots.forEach(d => d.setAttribute("opacity",0));
  });
  return svg;
}

function barsH(host, opts){
  const {rows, kind="int"} = opts;
  const rowH = 26, padT = 6, padB = 6, labelW = opts.labelW || 200, valueW = 68;
  const W = Math.max(host.clientWidth || 520, 300);
  const H = rows.length*rowH + padT + padB;
  const trackX = labelW + 8, trackW = Math.max(40, W - trackX - valueW - 6);
  const max = axisScale(rows.map(r => r.value)).max;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria||"ranking"}, host);
  rows.forEach((r,i) => {
    const y = padT + i*rowH;
    const t = el("text", {x:labelW,y:y+rowH/2+4,"text-anchor":"end",fill:"var(--ink-2)","font-size":12}, svg);
    t.textContent = r.label;
    el("rect", {x:trackX,y:y+5,width:trackW,height:rowH-14,fill:"#f0f3f7",rx:4}, svg);
    const w = max ? Math.max(r.value > 0 ? 3 : 0, r.value/max*trackW) : 0;
    if (w > 0){
      const bar = el("rect", {x:trackX,y:y+5,width:w,height:rowH-14,
        fill:r.color || "var(--s1)",rx:4}, svg);
      bar.addEventListener("mouseenter", ev => showTip(
        `<div class="tip-t">${esc(r.label)}</div><div class="tip-r"><i style="background:${
          r.color||"var(--s1)"}"></i>${esc(opts.measure||"Value")}<b>${fmt(r.value,kind)}</b></div>`,
        ev.clientX, ev.clientY));
      bar.addEventListener("mousemove", ev => showTip(tip.innerHTML, ev.clientX, ev.clientY));
      bar.addEventListener("mouseleave", hideTip);
    }
    const vt = el("text", {x:W-4,y:y+rowH/2+4,"text-anchor":"end",fill:"var(--ink)",
      "font-size":12,"font-weight":600,"font-family":"var(--mono)"}, svg);
    vt.textContent = fmt(r.value, kind);
  });
  return svg;
}

const CHART_REGISTRY = [];
function mountChart(id, draw){
  const host = document.getElementById(id);
  if (!host) return;
  draw(host);
  CHART_REGISTRY.push({host, draw});
}
let resizeT = null;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => CHART_REGISTRY.forEach(c => {

/* =========================================================================
   9. SERIES — monthly, from the real records
   ========================================================================= */

function monthlySeries(master, leaf){
  const out = [];
  for (let m = 0; m < 12; m++){
    const r = {from:startOfMonth(REPORT_YEAR,m), to:endOfMonth(REPORT_YEAR,m)};
    const a = aggregate(r, master, leaf);
    out.push({label:MONTH_NAMES[m].slice(0,3), agg:a,
              hasData:a.records > 0 || (a.mailed || 0) > 0});
  }
  return out;
}
const seriesVals = (ms, fn) => ms.map(m => m.hasData ? fn(m.agg) : null);
function highlightIndex(){
  if (state.month === "All Months") return -1;
  const [y,m] = state.month.split("-").map(Number);
  return y === REPORT_YEAR ? m-1 : -1;
}

/* Every day of the selected month. Once a month is chosen the trend charts show
   days rather than months, because a month view cannot show a day. */
function dailySeries(master, leaf){
  return dayOptions().map(d => {
    const dt = new Date(d.key + "T00:00:00");
    const a = aggregate({from:dt, to:dt}, master, leaf);
    return {label:d.label.slice(4), agg:a, hasData:!d.future};
  });
}
/* Which bar to emphasise in the daily charts: the selected day, if there is one. */
function dayHighlightIndex(){
  const day = selectedDay();
  return day ? Number(day.slice(8,10)) - 1 : -1;
}
/* The trend charts are daily whenever a single month is in view. */
const trendIsDaily = () => state.month !== "All Months";
const trendUnit = () => trendIsDaily() ? "By Day" : "By Month";
function monthTitle(){
  if (state.month === "All Months") return `All Months ${REPORT_YEAR}`;
  const [y,m] = state.month.split("-").map(Number);
  return `${MONTH_NAMES[m-1]} ${y}`;
}

/* -------------------------------------------------------------------------
   The day calendar. A month grid rather than a list, so a date is picked by
   looking at the month the way it is looked at on a wall - and each cell
   carries its call count, so which days are worth opening is visible before
   one is chosen. Only 2026 exists in the call logs, so the arrows stop at
   January and December rather than wandering into empty years.
   ------------------------------------------------------------------------- */

/* The most recent day that actually has calls. The logs were read on 12 August
   and that day is empty, so a "jump to today" shortcut would land on a blank
   report - this lands on the last day there is something to read. */
let LATEST_DAY = null;
function latestDayWithCalls(){
  if (LATEST_DAY !== null) return LATEST_DAY;
  const keys = Object.keys(dayCounts()).filter(k => dayCounts()[k] > 0).sort();
  LATEST_DAY = keys.length ? keys[keys.length-1] : "";
  return LATEST_DAY;
}
const shortDay = (key) => {
  const d = new Date(key + "T00:00:00");
  return `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)}`;
};

function monthKeyShift(key, by){
  const [y,m] = key.split("-").map(Number);
  const t = m - 1 + by;
  if (t < 0 || t > 11) return null;                 // outside the reported year
  return y + "-" + String(t + 1).padStart(2,"0");
}

function calendarPanel(){
  if (!state.calOpen || state.month === "All Months") return "";
  const [y,m] = state.month.split("-").map(Number);
  const first = startOfMonth(y,m-1), lead = first.getDay();
  const days = dayOptions(), picked = selectedDay(), todayKey = dkey(TODAY);
  const prevKey = monthKeyShift(state.month,-1), nextKey = monthKeyShift(state.month,1);

  /* A cell from the month either side, shown so the weeks read as whole rows.
     Clicking one moves to that month, the way a date picker is expected to
     behave - unless it falls outside 2026, which the call logs do not cover. */
  const spill = (d, key) => {
    const reachable = key && d <= TODAY;
    return `<button type="button" class="cal-cell other${
      d.getDay()===0||d.getDay()===6 ? " weekend" : ""}"
      ${reachable ? `data-goto="${dkey(d)}"` : "disabled"}
      aria-label="${esc(dayLabel(d))}${reachable ? "" : " — outside the call logs"}"
      >${d.getDate()}</button>`;
  };

  const cells = [];
  for (let i = lead; i > 0; i--) cells.push(spill(addDays(first,-i), prevKey));
  days.forEach(d => {
    const dt = new Date(d.key + "T00:00:00");
    const cls = ["cal-cell"];
    if (dt.getDay() === 0 || dt.getDay() === 6) cls.push("weekend");
    if (d.future) cls.push("future");
    if (d.key === todayKey) cls.push("today");
    const what = d.future ? "not yet"
               : d.calls ? `${d.calls} call${d.calls === 1 ? "" : "s"}` : "no calls";
    cells.push(`<button type="button" class="${cls.join(" ")}" data-day="${d.key}"
      aria-pressed="${picked === d.key}" ${d.future ? "disabled" : ""}
      aria-label="${esc(dayLabel(dt))} — ${what}" title="${what}"
      >${dt.getDate()}</button>`);
  });
  const tail = (7 - (cells.length % 7)) % 7;
  const lastDay = endOfMonth(y,m-1);
  for (let i = 1; i <= tail; i++) cells.push(spill(addDays(lastDay,i), nextKey));

  return `<div class="cal"><div class="cal-box">
    <div class="cal-head">
      <h4>${esc(monthTitle())}</h4>
      <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month"
        ${prevKey ? "" : "disabled"}>&lsaquo;</button>
      <button type="button" class="cal-nav" id="calNext" aria-label="Next month"
        ${nextKey ? "" : "disabled"}>&rsaquo;</button>
    </div>
    <div class="cal-grid" role="group" aria-label="Choose a day in ${esc(monthTitle())}">
      ${["S","M","T","W","T","F","S"].map((d,i) =>
        `<div class="cal-dow" aria-hidden="true">${d}</div>`).join("")}
      ${cells.join("")}
    </div>
    <div class="cal-foot">
      <button type="button" class="cal-link" id="calToday">Today</button>
      <button type="button" class="cal-link" id="calAll"${picked ? "" : " disabled"}
        >Whole month</button>
    </div></div>
    <p class="cal-note">Hover a date for its call count. ${
      latestDayWithCalls() ? `The last day with calls is ${
        esc(shortDay(latestDayWithCalls()))}.` : ""}</p></div>`;
}

const reviewRecords = () => DATA.records.filter(r => resolved(r).review);

function renderRail(){
  const rc = reviewRecords().length;
  const btn = p => {
    const cur = state.page === p.id ? ' aria-current="page"' : "";
    const badge = p.id === "review" && rc ? `<span class="badge">${rc}</span>` : "";
    return `<button type="button" data-page="${p.id}"${cur}><span>${esc(p.label)}</span>${badge}</button>`;

function filterBar(){
  const monthOpts = monthOptions().map(m => m === "All Months"
    ? `<option value="All Months"${state.month==="All Months"?" selected":""}>All Months</option>`
    : `<option value="${m.key}"${state.month===m.key?" selected":""}>${esc(m.label)}${
        m.hasData ? (m.partial ? " (partial)" : "") : " (no data)"}</option>`).join("");
  const showLeaf = state.master !== ALL_MASTERS && state.master !== NEEDS_REVIEW && hasChoice(state.master);

    ? [`<option value="${ALL_LEAF}"${state.leaf===ALL_LEAF?" selected":""}>${ALL_LEAF}</option>`]
        .concat(TAXONOMY[state.master].map(l =>
          `<option value="${esc(l)}"${state.leaf===l?" selected":""}>${esc(l)}</option>`)).join("")
    : "";

    <div class="filter-row">
      <div class="field"><label for="fMaster">Lead Source</label>
        <select id="fMaster">
          <option${state.master===ALL_MASTERS?" selected":""}>${ALL_MASTERS}</option>

          <option value="${NEEDS_REVIEW}"${state.master===NEEDS_REVIEW?" selected":""}>${NEEDS_REVIEW}</option>
        </select></div>
      <div class="field${showLeaf ? "" : " disabled"}"><label for="fLeaf">Standard CRM Source</label>
        ${showLeaf ? `<select id="fLeaf">${leafOpts}</select>`
          : `<select id="fLeaf" disabled><option>${
              state.master === ALL_MASTERS ? "select a Lead Source first"
              : state.master === NEEDS_REVIEW ? "not applicable"
              : "none — single CRM source"}</option></select>`}</div>
      <div class="field"><label for="fMonth">Report Month</label>
        <select id="fMonth">${monthOpts}</select></div>
      <div class="field${days.length ? "" : " disabled"}"><label for="fDay">Day</label>
        <button type="button" class="daybtn" id="fDay" aria-expanded="${!!state.calOpen}"
          ${days.length ? "" : "disabled"}>
          <span>${days.length
            ? (pickedDay ? esc(dayLabel(new Date(pickedDay + "T00:00:00"))) : ALL_DAYS)
            : "choose a month first"}</span>
          <span class="chev" aria-hidden="true">${state.calOpen ? "▲" : "▼"}</span>
        </button></div>
      <div class="field"><label for="fCompare">Compare To</label>
        <select id="fCompare">${modes.map(c =>
          `<option${state.compare===c?" selected":""}>${esc(c)}</option>`).join("")}</select></div>
      ${custom ? `<div class="field"><label for="fFrom">Custom From</label>

      <span>Compared With: <b>${prev ? esc(prev.label) : "not set"}</b></span>
      <span>Source: <b>${esc(state.master)}${
        showLeaf && state.leaf !== ALL_LEAF ? " › " + esc(state.leaf) : ""}</b></span>
      ${cur.isDay ? `<span>Calls That Day: <b>${
        fmt(dayCounts()[selectedDay()] || 0,"int")}</b></span>` : ""}
      ${selectedMonthPartial() ? '<span class="warn-inline">partial month — to 12 August</span>' : ""}

}
/* "Previous Day" only means something while one day is selected, so it is stood
   down whenever the selection widens rather than left silently mismatched. */
function guardCompare(){
  if (state.compare === PREVIOUS_DAY && !selectedDay()) state.compare = "Previous Month";
}
function setDay(key){
  state.day = key;
  guardCompare();
  state.logPage = 1;
  render();
}
function goToMonth(key, keepCalendarOpen){
  state.month = key;
  state.day = ALL_DAYS;                     // last month's 14th means nothing here
  if (!keepCalendarOpen && key === "All Months") state.calOpen = false;
  guardCompare();
  state.logPage = 1;
  render();
}

function wireFilters(){
  const on = (id,ev,fn) => { const n = document.getElementById(id); if (n) n.addEventListener(ev,fn); };
  on("fMaster","change", e => { state.master = e.target.value; state.leaf = ALL_LEAF; state.logPage=1; render(); });
  on("fLeaf","change",   e => { state.leaf = e.target.value; state.logPage=1; render(); });
  on("fMonth","change",  e => { goToMonth(e.target.value); });

  /* -- the day calendar -- */
  on("fDay","click",     () => { state.calOpen = !state.calOpen; render(); });
  on("calPrev","click",  () => { goToMonth(monthKeyShift(state.month,-1) || state.month, true); });
  on("calNext","click",  () => { goToMonth(monthKeyShift(state.month, 1) || state.month, true); });
  on("calAll","click",   () => { setDay(ALL_DAYS); });
  on("calToday","click", () => {
    state.month = mKey(TODAY);
    setDay(dkey(TODAY));
  });
  const grid = document.querySelector(".cal-grid");
  if (grid) grid.addEventListener("click", e => {
    const cell = e.target.closest(".cal-cell");
    if (!cell || cell.disabled) return;
    if (cell.dataset.day) { setDay(cell.dataset.day); return; }
    if (cell.dataset.goto){                       // a date from the neighbouring month
      state.month = cell.dataset.goto.slice(0,7);
      setDay(cell.dataset.goto);
    }
  });
  on("fCompare","change",e => { state.compare = e.target.value; render(); });
  on("fFrom","change",   e => { state.customFrom = e.target.value; render(); });
  on("fTo","change",     e => { state.customTo = e.target.value; render(); });
}

function kpiHeading(){
  if (state.master === ALL_MASTERS) return "All sources";
  if (state.master === NEEDS_REVIEW) return "Unclassified records";
  if (state.leaf !== ALL_LEAF && hasChoice(state.master)) return state.leaf;
  return state.master;
}
function kpiSub(){
  if (state.master === ALL_MASTERS)
    return "Every record in the call logs, including those the campaign could not classify.";
  if (state.master === NEEDS_REVIEW)
    return "Records whose campaign could not settle a Standard CRM Source.";
  if (state.leaf !== ALL_LEAF && hasChoice(state.master))
    return "This Standard CRM Source only, inside " + state.master + ".";
  return "All Standard CRM Sources inside " + state.master + " combined.";
}

function mailSection(cur, prevR){
  if (state.master !== "Direct Mail") return "";
  const render = (heading, scopeLeaf, cards, note) => {
    const a = aggregate(cur, "Direct Mail", scopeLeaf);
    const b = prevR ? aggregate(prevR, "Direct Mail", scopeLeaf) : null;
    return `<div class="sec" style="margin:18px 0 8px">
        <h2 style="font-size:13.5px">${esc(heading)}</h2>
        ${note ? `<p style="color:var(--warn-ink)">${esc(note)}</p>` : ""}</div>
      <div class="kpi-grid">${cards.map(d => kpiCard(d,a,b)).join("")}</div>`;
  };
  if (state.leaf !== ALL_LEAF){
    const g = MAIL_CARD_SETS.find(x => x.leaf === state.leaf);
    if (!g) return "";
    return `<div class="sec"><h2>Mail performance</h2>
        <p>Piece counts and cost from the Red Stone board. Call counts from the call logs.</p></div>` +
      render(g.heading, g.leaf, g.cards,
        leafCosted(g.leaf) ? "" : "no piece count or cost on the Red Stone board for this format");
  }
  return `<div class="sec"><h2>Mail performance by format</h2>
      <p>Piece counts and cost from the Red Stone board. Call counts from the call logs.</p></div>` +
    MAIL_CARD_SETS.map(g => render(g.heading, g.leaf, g.cards,
      leafCosted(g.leaf) ? "" : "no piece count or cost on the Red Stone board for this format")).join("") +
    MAIL_COMBINED_SETS.map(g => {
      const missing = g.leaves.filter(l => !leafCosted(l));
      return render(g.heading, g.leaves, g.cards, missing.length
        ? "withheld — " + missing.join(" and ") + (missing.length===1?" has":" have") + " no mail data" : "");
    }).join("");
}

/* Direct-mail pipeline, straight off the monday.com board. */
function dmPipelineSection(cur, prevR){
  if (state.master !== "Direct Mail") return "";
  const render = (heading, scopeLeaf, cards, note) => {
    const a = aggregate(cur, "Direct Mail", scopeLeaf);
    const b = prevR ? aggregate(prevR, "Direct Mail", scopeLeaf) : null;
    return `<div class="sec" style="margin:18px 0 8px">
        <h2 style="font-size:13.5px">${esc(heading)}</h2>
        ${note ? `<p style="color:var(--warn-ink)">${esc(note)}</p>` : ""}</div>
      <div class="kpi-grid">${cards.map(d => kpiCard(d,a,b)).join("")}</div>
      ${cards.some(c => c.key === "dmRevenue") ? revNote(a) : ""}`;
  };
  /* Revenue is only as complete as the board's Revenue column, so every place it
     appears says how many of the period's acquisitions it actually covers. */
  const revNote = (a) => {
    if (!a.dmKnown) return "";
    const n = a.dmAcquired, k = a.dmAcqWithRevenue;
    const acq = (c) => c + " acquisition" + (c === 1 ? "" : "s");
    let text;
    if (!n)        text = "No acquisition falls in this period, so there is no revenue to report.";
    else if (!k)   text = "The board records no revenue against the " + acq(n) +
                          " in this period, so this reads blank rather than zero.";
    else if (k === n) text = "Revenue is filled in on " +
                          (n === 1 ? "the one acquisition" : "all " + n + " acquisitions") +
                          " in this period, so this is the full revenue the board holds for it.";
    else           text = "Revenue covers " + k + " of the " + acq(n) + " in this period. The board " +
                          "leaves it blank on the other " + (n - k) + ", so this is less than the " +
                          "period's true revenue.";
    return `<p class="chart-note">${esc(text)}</p>`;
  };
  /* These counts share a screen with the call-log disposition counts and the two do
     not match — different objects out of different systems. Say so, with both live
     numbers in it, so the gap reads as an explanation rather than a bug. */
  const a0 = aggregate(cur, "Direct Mail",
    state.leaf === ALL_LEAF ? DM_PIPELINE_ALL.leaves : state.leaf);
  const booked = a0.disposition["Appointment Booked (H)"] || 0;
  const parked = a0.dmAppointment;
  const yearCalls = aggregate({from:new Date(REPORT_YEAR,0,1), to:new Date(REPORT_YEAR,11,31)},
    "Direct Mail", ALL_LEAF).calls;
  const head = `<div class="sec"><h2>Pipeline from the direct-mail board</h2>
    <p>Counted from the monday.com board \u201C📬 Direct Mail &amp; Postcard Leads\u201D,
       ${DM_ITEMS.length} items read on 11 August 2026. One item per property, not per call.
       The period filter runs on the board's Date Received, the only date it records \u2014
       Lead Stage carries no date of its own, so a lead received in March and acquired in
       July counts in March.</p></div>
  ${notice("info", `<p><b>Two sources on one screen, so read the labels.</b>
    <b>Appointment Booked</b> is counted from the call logs — calls whose Disposition reads
    <code>Appointment Booked (H)</code>, ${booked.toLocaleString("en-US")} of them in
    ${esc(cur.label)} for this selection. Everything else here is counted from the
    monday.com board, one row per property.</p>
    <p>The board also has an <code>Appointment</code> Lead Stage, and it reads
    <b>${parked === null ? "nothing" : parked.toLocaleString("en-US")}</b> for this selection
    rather than ${booked.toLocaleString("en-US")}. That is not a contradiction: the sheets count
    <b>calls</b> and the board counts <b>properties</b>; Lead Stage is only <b>where a lead stands
    today</b>, so a property that booked an appointment and then moved to Under Contract, Acquired
    or Dead no longer reads Appointment; and the two are different populations — ${
      DM_ITEMS.length.toLocaleString("en-US")} board properties against ${
      yearCalls.toLocaleString("en-US")} direct-mail calls for ${REPORT_YEAR}. The board's own
    stage figures are on the Outcomes page, labelled as board state. Acquired and Cancelled
    Contract are terminal, so those two do not drift this way.</p>`, true)}`;
  if (state.leaf !== ALL_LEAF){
    const g = DM_PIPELINE_SETS.find(x => x.leaf === state.leaf);
    if (!g) return "";
    return head + render(g.heading, g.leaf, g.cards);
  }
  return head +
    DM_PIPELINE_SETS.map(g => render(g.heading, g.leaf, g.cards)).join("") +
    render(DM_PIPELINE_ALL.heading, DM_PIPELINE_ALL.leaves, DM_PIPELINE_ALL.cards);
}

/* Every stage on the board against every mail format, all 452 items, no filter.
   This is the board's present state, which is what Lead Stage records. */
function dmStageMatrix(){
  const fmts = DM_BOARD.src.filter(sc => DM_ITEMS.some(i => i.source === sc));
  const cell = (stage, src) => DM_ITEMS.filter(i =>
    i.stage === stage && (src === null || i.source === src)).length;
  return `<section class="card">
    <div class="chart-head"><h3>Lead Stage by mail format</h3>
      <span class="unit">${DM_ITEMS.length} items, whole board</span></div>
    <div class="t-scroll" style="border:0"><table>
      <thead><tr><th class="l">Lead Stage</th>${
        fmts.map(f => `<th>${esc(f.replace("Direct Mail ","").replace(/[()]/g,""))}</th>`).join("")
        }<th>All</th></tr></thead>
      <tbody>${DM_STAGES.filter(st => cell(st,null) > 0 || DM_DEAL_STAGES.includes(st))
        .map(st => `<tr${DM_DEAL_STAGES.includes(st) ? ' class="total"' : ''}>
          <td class="l">${esc(st)}</td>
          ${fmts.map(f => `<td>${cell(st,f).toLocaleString("en-US")}</td>`).join("")}
          <td>${cell(st,null).toLocaleString("en-US")}</td></tr>`).join("")}
        <tr class="total"><td class="l">All stages</td>
          ${fmts.map(f => `<td>${DM_ITEMS.filter(i=>i.source===f).length.toLocaleString("en-US")}</td>`).join("")}
          <td>${DM_ITEMS.length.toLocaleString("en-US")}</td></tr>
      </tbody></table></div>
    <p class="chart-note">Under Contract shows ${dmStageCount("Under Contract")} because the one
      item sitting in the board's 📝 Under Contract group has its Lead Stage set to
      Cancelled Contract. Both readings are shown rather than picked between.</p>
    <p class="chart-note">New, Contacted, Interested, Appointment and Under Contract are stages a
      lead moves through, so each row is only what stands there today \u2014 not how many leads ever
      reached it. Acquired, Cancelled Contract and Dead are where leads stop, so those three do
      hold. This is why the board's Appointment row does not match the call logs'
      <code>Appointment Booked (H)</code> disposition count above.</p></section>`;
}

/* Horizontal breakdown of a count map, using the sheets' own value names. */

  const rows = Object.entries(map).sort((a,b) => b[1]-a[1]);

  return `<section class="card"><div class="chart-head"><h3>${esc(title)}</h3>
      <span class="unit">${total.toLocaleString("en-US")} records</span></div>
    ${note ? `<p class="chart-note" style="margin:0 0 8px">${esc(note)}</p>` : ""}
    <div class="t-scroll" style="border:0"><table><tbody>
      ${rows.map(([k,v]) => `<tr>
        <td class="l" style="width:55%">${esc(k)}</td>
        <td style="width:12%">${v.toLocaleString("en-US")}</td>
        <td style="width:10%">${(v/total*100).toFixed(1)}%</td>

        </div></td></tr>`).join("")}

}

    ${A.ctNotRecorded ? statTile("Caller Type Not Recorded", fmt(A.ctNotRecorded,"int"),

  ${mailSection(cur, prevR)}

function srcRows(){
  const cur = currentRange(), q = state.srcQuery.trim().toLowerCase();

    ? MASTERS.map(m => Object.assign({label:m, master:m, leaf:null}, aggregate(cur,m,ALL_LEAF)))
    : ALL_LEAVES.map(l => Object.assign({label:l, master:MASTER_OF[l], leaf:l},
        aggregate(cur,MASTER_OF[l],l)));
  rows.push(Object.assign({label:NEEDS_REVIEW, master:NEEDS_REVIEW, leaf:null, isReview:true},
    aggregate(cur,NEEDS_REVIEW,null)));

  const {col,dir} = state.srcSort;
  rows.sort((a,b) => {

    if (typeof av === "string") return av.localeCompare(bv)*dir;
    return ((av===null?-Infinity:av)-(bv===null?-Infinity:bv))*dir;
  });
  return rows;

/* Digits only, so "(510) 385-5660", "510-385-5660" and "5103855660" all match. */
const digitsOf = (v) => String(v || "").replace(/\D+/g, "");

/* Sentinel for "this field is empty". It has to be printable: a NUL does not
   survive an HTML attribute, and no sheet value looks like this. */
const BLANK_TOKEN = "::blank::";

const LOG_FILTERS = [
  {key:"logDir", id:"fDir", label:"Direction",   field:(r) => r.direction},
  {key:"logCC",  id:"fCC",  label:"Caller Type", field:(r) => r.callerType},
  {key:"logLT",  id:"fLT",  label:"Lead Type",   field:(r) => r.status},
  {key:"logDis", id:"fDis", label:"Disposition", field:(r) => r.disposition},
  {key:"logAg",  id:"fAg",  label:"Agent",       field:(r) => r.agent}
];
const logFiltersActive = () =>
  !!state.logQ.trim() || LOG_FILTERS.some(f => state[f.key]);

/* Records in the selected period and source, before the Call Log's own filters. */
function logScopeRecords(){
  const cur = currentRange();
  const scope = new Set(scopeLeaves(state.master, state.leaf));
  return DATA.records.filter(r => inRange(r.date, cur) &&
    scope.has(resolved(r).leaf || NEEDS_REVIEW));
}
/* ...and after them. The search box matches contact name, phone number and
   campaign; a numeric query is compared digit for digit against the phone. */
function logRecords(base){
  const q = state.logQ.trim().toLowerCase();
  const qd = digitsOf(state.logQ);
  return base.filter(r => {
    for (const f of LOG_FILTERS){
      const want = state[f.key];
      if (!want) continue;
      const got = f.field(r) || "";
      if (want === BLANK_TOKEN ? got !== "" : got !== want) return false;
    }
    if (!q) return true;
    if (qd.length >= 3 && digitsOf(r.phone).includes(qd)) return true;
    return (r.contact || "").toLowerCase().includes(q)
        || (r.phone   || "").toLowerCase().includes(q)
        || (r.campaign|| "").toLowerCase().includes(q)
        || (r.disposition || "").toLowerCase().includes(q)
        || (r.agent   || "").toLowerCase().includes(q);
  });
}

/* Options are built from the records actually in scope, commonest first, so the
   dropdowns never offer a value that would return nothing. */
function logOptions(base, f){
  const c = new Map();
  base.forEach(r => {
    const v = f.field(r) || "";
    c.set(v, (c.get(v) || 0) + 1);
  });
  const sel = state[f.key];
  const rows = [...c.entries()].sort((x,y) => y[1] - x[1]);
  return [`<option value="">All ${esc(f.label.toLowerCase())}s (${base.length.toLocaleString("en-US")})</option>`]
    .concat(rows.map(([v,n]) => {
      const val = v === "" ? BLANK_TOKEN : v;
      const lbl = v === "" ? "(blank)" : v;
      return `<option value="${esc(val)}"${sel===val?" selected":""}>${esc(lbl)} (${n.toLocaleString("en-US")})</option>`;
    }));
}

/* One row per call, the filtered set, quoted so commas in names survive. */
function exportCallLog(){
  const recs = logRecords(logScopeRecords());
  const cols = [["Date", r => iso(r.date)],
                ["Contact Name", r => r.contact],
                ["Phone", r => r.phone],
                ["Campaign", r => r.campaign],
                ["CRM Source", r => resolved(r).leaf || NEEDS_REVIEW],
                ["Sheet Lead Source", r => r.sheetSource],
                ["Direction", r => r.direction],
                ["Caller Type", r => r.callerType],
                ["Lead Type", r => r.status],
                ["Disposition", r => r.disposition],
                ["Agent", r => r.agent]];
  const esc2 = (v) => '"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"';
  const lines = [cols.map(c => esc2(c[0])).join(",")];
  recs.forEach(r => { lines.push(cols.map(c => esc2(c[1](r))).join(",")); });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "thb-call-log-" + currentRange().label.replace(/\s+/g,"-").toLowerCase() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---- Classification ---- */
function pageReview(){
  const revs = reviewRecords();
  const byReason = {}, byCampaign = {};
  revs.forEach(r => {
    const res = resolved(r);
    byReason[res.reason || "unknown"] = (byReason[res.reason || "unknown"] || 0) + 1;
    const k = (r.campaign || "(blank)");
    byCampaign[k] = (byCampaign[k] || 0) + 1;
  });
  const per = 40;
  const pages = Math.max(1, Math.ceil(revs.length/per));
  if (state.reviewPage > pages) state.reviewPage = pages;
  const shown = revs.slice((state.reviewPage-1)*per, state.reviewPage*per);
  const options = MASTERS.map(m =>
    `<optgroup label="${esc(m)}">${TAXONOMY[m].map(l =>
      `<option value="${esc(l)}">${esc(l)}</option>`).join("")}</optgroup>`).join("");
  const classified = DATA.records.length - revs.length;

  return `<div class="page-head"><h2>Classification</h2>
    <p>Standard CRM Source is derived from the <b>Campaign</b> column, not from the sheets' own
       Lead Source column. Anything the campaign cannot settle waits here.</p></div>
  <div class="kpi-grid hero">
    ${statTile("Records", fmt(DATA.records.length,"int"), "in the 2026 Call Logs")}
    ${statTile("Classified", fmt(classified,"int"),
      (classified/DATA.records.length*100).toFixed(1) + "% of records")}
    ${statTile("Needs Review", fmt(revs.length,"int"),
      (revs.length/DATA.records.length*100).toFixed(1) + "% of records")}
    ${statTile("Manual Overrides", fmt(OVERRIDES.size,"int"), "never overwritten by auto-classify")}
  </div>
  <div class="sec"><h2>Why review is needed</h2></div>
  ${breakdown("Reason", byReason, revs.length || 1)}
  <div class="sec"><h2>Campaigns awaiting a rule</h2>
    <p>These campaign names appear in the logs but do not resolve to a Standard CRM Source.</p></div>
  ${breakdown("Campaign", Object.fromEntries(
      Object.entries(byCampaign).sort((a,b)=>b[1]-a[1]).slice(0,20)), revs.length || 1,
      Object.keys(byCampaign).length + " distinct campaigns need a rule")}
  <div class="sec"><h2>Review queue</h2>
    <p>Assigning a source here is a manual override and is never overwritten by
       re-running auto-classification.</p></div>
  <div class="table-tools">
    <button class="btn" id="rerun"${OVERRIDES.size ? "" : " disabled"}>Re-run auto-classification (clears ${OVERRIDES.size})</button>
    <span class="spacer"></span>
    <span style="font-size:13px;color:var(--ink-3)">${revs.length.toLocaleString("en-US")} awaiting review</span>
  </div>
  <div class="t-scroll"><table>
    <thead><tr><th class="l">Date</th><th class="l">Campaign</th><th class="l">Sheet Lead Source</th>
      <th class="l">Why</th><th class="l">Assign CRM Source</th></tr></thead>
    <tbody>${shown.map(r => `<tr>
      <td class="l">${iso(r.date)}</td>
      <td class="l">${r.campaign ? esc(r.campaign) : '<span class="pill warn">blank</span>'}</td>
      <td class="l mono-sm">${esc(r.sheetSource || "—")}</td>
      <td class="l"><span class="pill warn">${esc(resolved(r).reason || "")}</span></td>
      <td class="l"><select class="assign" data-id="${esc(r.id)}" aria-label="Assign CRM source">
        <option value="">— assign —</option>${options}</select></td></tr>`).join("")}</tbody>
  </table></div>
  ${pages > 1 ? `<div class="pager">
    <button class="btn" id="rPrev"${state.reviewPage===1?" disabled":""}>Previous</button>
    <span>Page ${state.reviewPage} of ${pages}</span>
    <button class="btn" id="rNext"${state.reviewPage===pages?" disabled":""}>Next</button></div>` : ""}
  <div class="sec"><h2>Rules, in priority order</h2></div>
  <section class="card"><div class="map-list">
    ${FAMILIES.map(([re,master,leaf,why,split]) => `<div class="map-row">
      <span class="from mono-sm">${esc(String(re).replace(/^\/|\/$/g,""))}</span>
      <span class="arrow">${split ? "+ method" : "→"}</span>
      <span class="to">${esc(leaf || master + " (channel needed)")}${split ? " - Call / Web Form" : ""}</span>
    </div>`).join("")}
  </div></section>`;
}
function wireReview(root){
  root.querySelectorAll("select.assign").forEach(s => s.addEventListener("change", e => {
    if (e.target.value){ setOverride(e.target.dataset.id, e.target.value); render(); }
  }));
  const rr = root.querySelector("#rerun");
  if (rr) rr.addEventListener("click", () => { clearOverrides(); render(); });
  const pv = root.querySelector("#rPrev");
  if (pv) pv.addEventListener("click", () => { state.reviewPage--; render(); });
  const nx = root.querySelector("#rNext");
  if (nx) nx.addEventListener("click", () => { state.reviewPage++; render(); });
}

/* =========================================================================

function render(){
  CHART_REGISTRY.length = 0;
  hideTip();
  const main = document.getElementById("main");
  switch(state.page){
    case "dashboard": main.innerHTML = pageDashboard(); break;
    case "source":    main.innerHTML = pageSource();    break;
    case "calls":     main.innerHTML = pageCalls();     break;
    case "outcomes":  main.innerHTML = pageOutcomes();  break;
    case "review":    main.innerHTML = pageReview();    break;
    case "sync":      main.innerHTML = pageSync();      break;
    case "admin":     main.innerHTML = pageAdmin();     break;
  }
  renderRail();
  wireFilters();
  if (state.page === "dashboard" || state.page === "source"){
    const h = document.getElementById("srcTable");
    if (h){ h.innerHTML = sourceTable(); wireSourceTable(h); }
  }
  if (state.page === "dashboard") drawDashboardCharts();
  if (state.page === "source"){
    const cur = currentRange();
    const rows = (state.srcView === "master"
      ? MASTERS.map(m => ({label:m, value:aggregate(cur,m,ALL_LEAF).calls}))
      : ALL_LEAVES.map(l => ({label:l, value:aggregate(cur,MASTER_OF[l],l).calls})))
      .concat([{label:NEEDS_REVIEW, value:aggregate(cur,NEEDS_REVIEW,null).calls, color:"var(--warn)"}])
      .sort((a,b) => b.value - a.value);
    mountChart("chRank", h => barsH(h,{rows,kind:"int",measure:"Calls",
      labelW: state.srcView === "master" ? 150 : 240, aria:"Calls by source"}));
  }
  if (state.page === "calls")  wireCalls(main);
  if (state.page === "review") wireReview(main);
}

/* Default to the most recent complete month with data. */
(function initMonth(){
  const opts = monthOptions().filter(o => o !== "All Months" && o.hasData && !o.partial);
  if (opts.length) state.month = opts[opts.length-1].key;
})();

render();
