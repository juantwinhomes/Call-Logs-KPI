/* The dataset spans Jan 2025 -> Aug 2026 so "Same Month Last Year" resolves.

const DATA_START = {y:2025, m:0};

   ========================================================================= */

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20260811);
const jitter = (spread) => 1 + (rnd() * 2 - 1) * spread;
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

   supplied costing registry further down, never from this generator. */

const CITIES = [["Oakland","94601"],["Hayward","94541"],["San Leandro","94577"],["Richmond","94804"],
  ["Vallejo","94590"],["Antioch","94509"],["San Jose","95116"],["Fremont","94536"],
  ["Concord","94520"],["Pittsburg","94565"],["Union City","94587"],["Milpitas","95035"]];

  "Estudillo Ave","Springdale Dr","College Ter","Redwood Rd","Franklin St","Cherry Way"];
const FIRST = ["Robert","Maria","James","Linda","Michael","Patricia","David","Barbara","William",
  "Susan","Thomas","Nancy","Anthony","Karen","Angela","Rosa","Hector","Dorothy"];
const LAST = ["Nguyen","Garcia","Johnson","Martinez","Williams","Lopez","Brown","Rodriguez",

const AGENTS = ["Cherry","Thea","Kyle","Genesis","John AI","Juan (Live)","Unknown"];

/* -------------------------------------------------------------------------
   MARKETING COST — REAL DATA, NOT SAMPLE DATA
   -------------------------------------------------------------------------
   Cost is NOT modelled. The only channel with verified spend is Postcard,

/* -------------------------------------------------------------------------
   SOURCE COSTING REGISTRY
   -------------------------------------------------------------------------
   Cost per source is SUPPLIED DATA. It is never modelled, estimated or
   inferred, and no cost figure is invented anywhere in this app.

   Postcard is populated from the Red Stone board above. Every other source
   is awaiting a costing figure and reports "awaiting costing" until one is
   supplied — deliberately not zero, because zero is a claim about spend and
   an empty registry entry is not.

   To add a source's costing, set supplied:true and fill byMonth with
   {"YYYY-MM": {cost, pieces}}. Nothing else in the app needs to change:
   every cost KPI, the source table and the ROI maths pick it up.
   ------------------------------------------------------------------------- */
const SOURCE_COSTING = {};
SOURCES.forEach(s => { SOURCE_COSTING[s] = {supplied:false, byMonth:{}, note:"awaiting costing"}; });
SOURCE_COSTING["Postcard"] = {
  supplied: true,
  origin: "Red Stone Upload board (Monday.com 18392647066) — 15 postcard jobs",
  byMonth: {},            /* filled from REDSTONE_JOBS below */
  note: "postcard jobs only; THB_Letter_01 excluded"
};
const hasCostData = (source) => !!(SOURCE_COSTING[source] && SOURCE_COSTING[source].supplied);
const costSuppliedCount = () => SOURCES.filter(hasCostData).length;

/* Effective mail date: the recorded mail date, or the upload date when the
   mail date is missing. estimated=true drives the UI flag. */
function jobDate(j){
  return {date:new Date((j.mail || j.upload) + "T00:00:00"), estimated:!j.mail};
}
const POSTCARD_JOBS = REDSTONE_JOBS.filter(j => j.type === "Postcard");
const REDSTONE_FIRST_MAIL = jobDate(POSTCARD_JOBS[0]).date;

/* Postcard mail volume and cost inside a date range, straight from the board. */
function postcardMail(range){
  let qty = 0, cost = 0, jobs = 0, estimated = 0;
  POSTCARD_JOBS.forEach(j => {
    const d = jobDate(j);
    if (d.date < range.from || d.date > range.to) return;
    qty += j.qty; cost += j.cost; jobs++;
    if (d.estimated) estimated++;
  });
  return {qty, cost, jobs, estimated};
}

/* Roll the board up into the costing registry, keyed by month. */
POSTCARD_JOBS.forEach(j => {
  const d = jobDate(j).date;
  const key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  const b = SOURCE_COSTING["Postcard"].byMonth;
  if (!b[key]) b[key] = {cost:0, pieces:0};
  b[key].cost += j.cost;
  b[key].pieces += j.qty;
});

/* Supplied cost + pieces for a source inside a range.
   Returns null cost when no costing has been supplied for that source. */
function suppliedCost(range, source){
  if (source === ALL_SOURCES){
    /* Never sum a partial company total out of one channel's costing. */
    return SOURCES.every(hasCostData)
      ? SOURCES.reduce((acc,s) => {
          const c = suppliedCost(range, s);
          return {cost:acc.cost + (c.cost||0), pieces:acc.pieces + c.pieces};
        }, {cost:0, pieces:0})
      : {cost:null, pieces:0};
  }
  if (!hasCostData(source)) return {cost:null, pieces:0};
  if (source === "Postcard"){
    const m = postcardMail(range);
    return {cost:m.cost, pieces:m.qty, jobs:m.jobs, estimated:m.estimated};
  }
  /* generic path for costing supplied by month */
  let cost = 0, pieces = 0;
  const reg = SOURCE_COSTING[source].byMonth;
  monthKeysIn(range).forEach(k => {
    if (!reg[k]) return;
    const f = monthOverlapFraction(k, range);
    cost   += reg[k].cost   * f;
    pieces += reg[k].pieces * f;
  });
  return {cost, pieces};
}

const DISPOSITIONS_LIVE = ["Contacted","Interested","Working"];
const DISPOSITIONS_DEAD = ["Non-Seller | Other","Unqualified Seller | Retail",
  "Unqualified Seller | Poor Location","No Contact","Non-Seller | SPAM",
  "Unqualified Seller | Already Listed"];

/* Every month present in the data, oldest first. */
function buildMonths(){
  const out = [];
  let y = DATA_START.y, m = DATA_START.m;
  while (y < 2026 || (y === 2026 && m <= 11)) {
    out.push({y, m, key:`${y}-${String(m+1).padStart(2,"0")}`, label:`${MONTH_NAMES[m]} ${y}`});
    m++; if (m > 11) { m = 0; y++; }
  }
  return out;
}
const MONTHS = buildMonths();

/* Trend shape: 2025 runs lower than 2026 so year-over-year reads as growth.
   August 2026 is partial (11 of 31 days). Sep-Dec 2026 carry no data at all. */
function monthScale(mo){
  if (mo.y === 2026 && mo.m > 7) return 0;                 // future — no data
  if (mo.y === 2026 && mo.m === 7) return 0.355;           // partial month
  const idx = MONTHS.findIndex(x => x.key === mo.key);
  const growth = 0.62 + idx * 0.021;                       // steady climb
  const season = 1 + Math.sin((mo.m + 1) / 12 * Math.PI * 2) * 0.10;
  return growth * season;
}

function buildDataset(){
  const volume = [];  // {monthKey, source, calls, unique_callers} — no cost, ever
  const leads = [];   // standardized lead-level records
  const calls = [];   // a sample of individual call records for the Calls page
  let leadSeq = 1000;

  MONTHS.forEach(mo => {
    const scale = monthScale(mo);
    SOURCES.forEach(src => {
      const p = PROFILES[src];
      if (scale === 0){
        volume.push({monthKey:mo.key, source:src, calls:0, unique_callers:0});
        return;
      }
      const nLeads = Math.max(0, Math.round(p.leads * scale * jitter(.22)));
      const nCalls = Math.max(0, Math.round(nLeads * p.calls * jitter(.18)));
      const uniq   = Math.max(0, Math.round(nCalls * (0.82 + rnd() * 0.1)));

      volume.push({monthKey:mo.key, source:src, calls:nCalls, unique_callers:uniq});

      /* lead-level records, funnel flags strictly nested */
      let nQual = 0, nAppt = 0, nOffer = 0, nCtr = 0, nAcq = 0;
      for (let i = 0; i < nLeads; i++){
        const qualified   = rnd() < p.qual;
        const appointment = qualified   && rnd() < p.appt;
        const offer       = appointment && rnd() < p.offer;
        const contract    = offer       && rnd() < p.ctr;
        const acquisition = contract    && rnd() < p.acq;
        if (qualified) nQual++;
        if (appointment) nAppt++;
        if (offer) nOffer++;
        if (contract) nCtr++;
        if (acquisition) nAcq++;

        const day = 1 + Math.floor(rnd() * (mo.y===2026 && mo.m===7 ? 11 : 28));
        const [city, zip] = pick(CITIES);
        const first = pick(FIRST), last = pick(LAST);
        const net   = acquisition ? Math.round((56000 + rnd() * 39000) / 100) * 100 : 0;
        const gross = acquisition ? Math.round((net * (2.0 + rnd() * 1.1)) / 100) * 100 : 0;

        let status, disposition;
        if (acquisition)      { status = "Acquired";       disposition = "Qualified | Acquired"; }
        else if (contract)    { status = "Under Contract"; disposition = "Qualified | Contract"; }
        else if (offer)       { status = "Offer Made";     disposition = "Qualified | Offer"; }
        else if (appointment) { status = "Appointment";    disposition = "Qualified | Appointment"; }
        else if (qualified)   { status = "Qualified";      disposition = "Qualified | Working"; }
        else if (rnd() < .45) { status = "Dead";           disposition = pick(DISPOSITIONS_DEAD); }
        else                  { status = "Working";        disposition = pick(DISPOSITIONS_LIVE); }

        leads.push({
          lead_id: "L-" + (++leadSeq),
          date: new Date(mo.y, mo.m, day),
          caller_name: first + " " + last,
          phone_number: "(510) " + (200 + Math.floor(rnd()*700)) + "-" + String(1000 + Math.floor(rnd()*8999)).slice(0,4),
          email: first.toLowerCase() + "." + last.toLowerCase() + "@example.com",
          property_address: (100 + Math.floor(rnd()*8900)) + " " + pick(STREETS),
          city, state:"CA", zip,
          marketing_source: src,
          campaign: pick(CAMPAIGNS[src] || CAMPAIGNS._default),
          lead_status: status,
          disposition,
          qualified, appointment, offer, contract, acquisition,
          marketing_cost: 0,               // spend is tracked at channel level, not per lead
          gross_revenue: gross,
          net_revenue: net
        });
      }

      /* a proportional sample of call records for the Calls page table */
      const sampleN = Math.min(nCalls, Math.round(nCalls * 0.22));
      for (let i = 0; i < sampleN; i++){
        const day = 1 + Math.floor(rnd() * (mo.y===2026 && mo.m===7 ? 11 : 28));
        const inbound = rnd() < 0.31;      // real logs run ~31% inbound / 69% outbound
        calls.push({
          date: new Date(mo.y, mo.m, day),
          source: src,
          direction: inbound ? "Inbound" : "Outbound",
          agent: pick(AGENTS),
          caller_name: pick(FIRST) + " " + pick(LAST),
          first_time: rnd() < 0.58,
          appointment_booked: rnd() < 0.035
        });
      }
    });
  });

  leads.sort((a,b) => b.date - a.date);
  calls.sort((a,b) => b.date - a.date);
  return {volume, leads, calls};
}

const DATA = buildDataset();

/* =========================================================================
   3. PERIOD RESOLUTION
      Every filter combination resolves to a concrete date range, so the KPI
      engine only ever deals with {from, to}. Comparison ranges resolve the
      same way, which keeps "Previous 30 Days" and "Previous Month"
      structurally identical to compute.
   ========================================================================= */

const state = {
  source: ALL_SOURCES,
  month: "All Months",
  compare: "Previous Month",
  customFrom: "2026-07-01",
  customTo: "2026-07-31",
  page: "dashboard",
  srcSort: {col:"leads", dir:-1},
  srcQuery: "",
  srcPage: 1
};

const dayMs = 86400000;
const startOfMonth = (y,m) => new Date(y, m, 1);
const endOfMonth   = (y,m) => new Date(y, m+1, 0);
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const iso = (d) => d.toISOString().slice(0,10);

function monthOptions(){
  /* Report-month choices are generated from the dates actually present in the
     data (build prompt §2: "generate the available months dynamically"). */
  const withData = new Set(DATA.leads.map(l => `${l.date.getFullYear()}-${String(l.date.getMonth()+1).padStart(2,"0")}`));
  const out = ["All Months"];
  MONTHS.filter(mo => mo.y === REPORT_YEAR).forEach(mo => {
    out.push({
      label:`${MONTH_NAMES[mo.m]} ${mo.y}`,
      key:mo.key,
      hasData:withData.has(mo.key),
      partial:withData.has(mo.key) && endOfMonth(mo.y, mo.m) >= TODAY
    });
  });
  return out;
}
/* Is the selected report month still in progress? */
function selectedMonthPartial(){
  if (state.month === "All Months") return false;
  const m = monthOptions().find(o => o !== "All Months" && o.key === state.month);
  return !!(m && m.partial);
}

function currentRange(){
  if (state.month === "All Months"){
    return {from:startOfMonth(REPORT_YEAR,0), to:endOfMonth(REPORT_YEAR,11), label:`All Months ${REPORT_YEAR}`};
  }
  const [y,m] = state.month.split("-").map(Number);
  return {from:startOfMonth(y,m-1), to:endOfMonth(y,m-1), label:`${MONTH_NAMES[m-1]} ${y}`};
}

function compareRange(cur){
  const mode = state.compare;
  if (mode === "Custom Period"){
    const f = new Date(state.customFrom + "T00:00:00");
    const t = new Date(state.customTo   + "T00:00:00");
    if (isNaN(f) || isNaN(t) || f > t) return null;
    return {from:f, to:t, label:`${iso(f)} to ${iso(t)}`};
  }
  if (mode === "Previous Month"){
    if (state.month === "All Months"){
      return {from:startOfMonth(REPORT_YEAR-1,0), to:endOfMonth(REPORT_YEAR-1,11),
              label:`All Months ${REPORT_YEAR-1}`, note:"previous month is undefined for All Months — comparing with the prior year"};
    }
    const y = cur.from.getFullYear(), m = cur.from.getMonth();
    const p = new Date(y, m-1, 1);
    return {from:startOfMonth(p.getFullYear(),p.getMonth()), to:endOfMonth(p.getFullYear(),p.getMonth()),
            label:`${MONTH_NAMES[p.getMonth()]} ${p.getFullYear()}`};
  }
  if (mode === "Same Month Last Year"){
    const y = cur.from.getFullYear()-1;
    if (state.month === "All Months")
      return {from:startOfMonth(y,0), to:endOfMonth(y,11), label:`All Months ${y}`};
    const m = cur.from.getMonth();
    return {from:startOfMonth(y,m), to:endOfMonth(y,m), label:`${MONTH_NAMES[m]} ${y}`};
  }
  const n = mode === "Previous 30 Days" ? 30 : mode === "Previous 60 Days" ? 60 : 90;
  const to = addDays(cur.from, -1);
  const from = addDays(to, -(n-1));
  return {from, to, label:`${n} days to ${iso(to)}`};
}

/* =========================================================================
   4. KPI ENGINE
      One aggregate() over a date range + source, then every KPI is derived
      from that aggregate. safeDiv keeps divide-by-zero out of the UI: an
      undefined ratio renders as an em dash, never NaN or Infinity.
   ========================================================================= */

const safeDiv = (a,b) => (b && isFinite(a/b)) ? a/b : null;
const inRange = (d,r) => d >= r.from && d <= r.to;

function monthKeysIn(range){
  return MONTHS.filter(mo => {
    const s = startOfMonth(mo.y, mo.m), e = endOfMonth(mo.y, mo.m);
    return e >= range.from && s <= range.to;
  }).map(mo => mo.key);
}

/* Channel-level rows (spend / pieces / calls) are monthly, so a day-level
   range prorates them by the share of the month it covers. */
function monthOverlapFraction(monthKey, range){
  const [y,m] = monthKey.split("-").map(Number);
  const s = startOfMonth(y,m-1), e = endOfMonth(y,m-1);
  const from = range.from > s ? range.from : s;
  const to   = range.to   < e ? range.to   : e;
  if (to < from) return 0;
  const days = Math.round((to - from) / dayMs) + 1;
  const total = e.getDate();
  return Math.min(1, days / total);
}

function aggregate(range, source){
  const srcFilter = (s) => source === ALL_SOURCES ? true : s === source;
  const keys = new Set(monthKeysIn(range));

  /* Volume (calls) is sample data. Cost and mailed pieces are supplied data
     and come only from the costing registry — never from the generator. */
  let calls = 0, uniqueCallers = 0;
  DATA.volume.forEach(r => {
    if (!keys.has(r.monthKey) || !srcFilter(r.source)) return;
    const f = monthOverlapFraction(r.monthKey, range);
    if (!f) return;
    calls         += r.calls          * f;
    uniqueCallers += r.unique_callers * f;
  });

  const costing = suppliedCost(range, source);
  const spend  = costing.cost;          /* null when no costing supplied */
  const mailed = costing.pieces;
  const costKnown = spend !== null;

  let leads=0, qualified=0, appointments=0, offers=0, contracts=0, acquisitions=0,
      gross=0, net=0;
  DATA.leads.forEach(l => {
    if (!srcFilter(l.marketing_source) || !inRange(l.date, range)) return;
    leads++;
    if (l.qualified)   qualified++;
    if (l.appointment) appointments++;
    if (l.offer)       offers++;
    if (l.contract)    contracts++;
    if (l.acquisition) acquisitions++;
    gross += l.gross_revenue;
    net   += l.net_revenue;
  });

  /* Every cost-derived KPI is null unless costing was supplied. Null renders
     as an em dash with an "awaiting costing" chip — never as zero, and never
     as a figure this app chose. */
  return {
    costKnown,
    spend: costKnown ? Math.round(spend) : null,
    mailed: Math.round(mailed),
    calls: Math.round(calls),
    uniqueCallers: Math.round(uniqueCallers),
    leads, qualified, appointments, offers, contracts, acquisitions,
    gross, net,
    cpl:  costKnown ? safeDiv(spend, leads)        : null,
    cpql: costKnown ? safeDiv(spend, qualified)    : null,
    cpa:  costKnown ? safeDiv(spend, acquisitions) : null,
    cpc:  costKnown ? safeDiv(spend, calls)        : null,
    roi:  costKnown && spend > 0 ? (net - spend) / spend * 100 : null,
    responseRate: mailed > 0 ? calls / mailed * 100 : null,
    perCaller:    safeDiv(mailed, uniqueCallers),
    costPerPiece: costKnown ? safeDiv(spend, mailed) : null,
    jobs: costing.jobs || 0,
    estimatedJobs: costing.estimated || 0
  };
}

/* =========================================================================
   5. FORMATTING
   ========================================================================= */

const DASH = "—";
function fmt(v, kind){
  if (v === null || v === undefined || (typeof v === "number" && !isFinite(v))) return DASH;
  switch(kind){
    case "int":  return Math.round(v).toLocaleString("en-US");
    case "usd0": return "$" + Math.round(v).toLocaleString("en-US");
    case "usd2": return v >= 100
                   ? "$" + Math.round(v).toLocaleString("en-US")
                   : "$" + v.toFixed(2);
    case "pct":  return v.toFixed(1) + "%";
    case "pct2": return v.toFixed(2) + "%";
    case "dec1": return v.toLocaleString("en-US",{maximumFractionDigits:1});
    default:     return String(v);
  }
}
function compactUSD(v){
  if (v === null) return DASH;
  const a = Math.abs(v);
  if (a >= 1e6) return "$" + (v/1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + Math.round(v/1e3) + "k";
  return "$" + Math.round(v);
}
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ARROW_UP   = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M4.5 1L8 6.5H1z" fill="currentColor"/></svg>';
const ARROW_DOWN = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M4.5 8L1 2.5h7z" fill="currentColor"/></svg>';
const DOT_FLAT   = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><rect x="1" y="4" width="7" height="1.6" fill="currentColor"/></svg>';
const ICON_CLOCK = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 2.7V5l1.8 1.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

/* Delta chip. Tone is derived from the KPI's own polarity, so a rising cost
   reads red and a falling cost reads green — never "up = green" by reflex.
   The arrow glyph and the sign carry the meaning alongside colour. */
function deltaChip(cur, prev, dir){
  if (cur === null || prev === null) return '<span class="chip none">no comparison</span>';
  if (prev === 0 && cur === 0)      return '<span class="chip flat">' + DOT_FLAT + ' no change</span>';
  if (prev === 0)                   return '<span class="chip none">no prior data</span>';
  const pct = (cur - prev) / Math.abs(prev) * 100;
  const rose = cur > prev, fell = cur < prev;
  let tone = "flat";
  if (dir === "up")   tone = rose ? "good" : fell ? "bad" : "flat";
  if (dir === "down") tone = fell ? "good" : rose ? "bad" : "flat";
  const glyph = rose ? ARROW_UP : fell ? ARROW_DOWN : DOT_FLAT;
  const sign = pct > 0 ? "+" : "";
  return `<span class="chip ${tone}">${glyph} ${sign}${pct.toFixed(2)}%</span>`;
}
function absDelta(cur, prev, kind){
  if (cur === null || prev === null) return "";
  const d = cur - prev;
  const sign = d > 0 ? "+" : d < 0 ? "−" : "";
  return sign + fmt(Math.abs(d), kind).replace("-","");
}

function kpiCard(def, curAgg, prevAgg){
  const cur = curAgg[def.key], prev = prevAgg ? prevAgg[def.key] : null;

  /* A cost KPI with no supplied costing states that plainly. It is not a
     zero and not an estimate — the figure simply has not been provided. */
  if (COST_KPI_KEYS.has(def.key) && !curAgg.costKnown){
    return `<article class="kpi">
      <p class="kpi-title">${esc(def.title)}</p>
      <p class="kpi-value empty">${DASH}</p>
      <div class="kpi-foot">
        <span class="chip flat">${ICON_CLOCK} awaiting costing</span>
        <p class="kpi-prev">no spend figure supplied for this source</p>
      </div>
    </article>`;
  }
  return `<article class="kpi">
    <p class="kpi-title">${esc(def.title)}</p>
    <p class="kpi-value${cur === null ? " empty" : ""}">${fmt(cur, def.fmt)}</p>
    <div class="kpi-foot">
      ${deltaChip(cur, prev, def.dir)}
      <p class="kpi-prev">prev ${fmt(prev, def.fmt)}${
        prev !== null && cur !== null ? " · " + absDelta(cur, prev, def.fmt) : ""}</p>
    </div>
  </article>`;
}

/* =========================================================================
   6. CHARTS
      Hand-drawn SVG: no external library (and none could load — the artifact
      CSP blocks every outside host). Shared conventions across all charts:
      hairline grid, recessive axes, 4px rounded data-ends anchored to the
      baseline, 2px lines, 8px markers, a 2px surface gap between adjacent
      bars, selective direct labels, and a hover tooltip on every mark.
   ========================================================================= */

const tip = document.getElementById("tip");
let tipRAF = null;
function showTip(html, x, y){
  tip.innerHTML = html;
  tip.style.opacity = "1";
  tip.setAttribute("aria-hidden","false");
  if (tipRAF) cancelAnimationFrame(tipRAF);
  tipRAF = requestAnimationFrame(() => {
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 10;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (left < 8) left = 8;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  });
}
function hideTip(){ tip.style.opacity = "0"; tip.setAttribute("aria-hidden","true"); }
document.addEventListener("scroll", hideTip, true);

/* Axis scale. The tick STEP is snapped to the 1/2/2.5/5/10 ladder first, then
   the bounds are derived from it — so gridlines always land on round numbers
   instead of values like 12.5 or 37.5. */
function niceStep(rough){
  if (!isFinite(rough) || rough <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const n = rough / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function axisScale(vals, ticks){
  ticks = ticks || 4;
  const clean = vals.filter(v => v !== null && isFinite(v));
  const hi = Math.max(...clean, 0);
  const lo = Math.min(...clean, 0);
  if (hi === 0 && lo === 0) return {min:0, max:1, step:0.25};
  if (lo >= 0){
    const step = niceStep(hi * 1.08 / ticks);
    return {min:0, max:step * ticks, step};
  }
  const step = niceStep((hi - lo) * 1.08 / ticks);
  const min = Math.floor(lo / step) * step;
  let max = min + step * ticks;
  while (max < hi) max += step;
  return {min, max, step};
}
/* Gridline values from min to max inclusive, tolerant of float drift. */
function tickValues(sc){
  const out = [];
  const n = Math.round((sc.max - sc.min) / sc.step);
  for (let i = 0; i <= n; i++) out.push(sc.min + sc.step * i);
  return out;
}

const SVG_NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent){
  const n = document.createElementNS(SVG_NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

/* A rect with only its two data-end corners rounded, anchored to the
   baseline — a plain rounded rect would round the baseline too. */
function barPath(x, y, w, h, r){
  r = Math.min(r, w/2, h);
  if (h <= 0.6) return `M${x} ${y+h} h${w}`;
  return `M${x} ${y+h} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h} Z`;
}

const CHART_PAD = {t:16, r:14, b:30, l:52};

/* A series with no values at all gets an explicit empty state. Drawing an
   axis for an all-null series produces meaningless ticks ($1, $1, $0) and
   reads as "the value is near zero" when the truth is "there is no value". */
function emptyChart(host, msg, height){
  const W = Math.max(host.clientWidth || 520, 300), H = height || 210;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":msg}, host);
  el("rect", {x:1, y:1, width:W-2, height:H-2, rx:8, fill:"var(--surface-2)",
    stroke:"var(--rule-soft)", "stroke-dasharray":"4 4"}, svg);
  const t = el("text", {x:W/2, y:H/2 - 2, "text-anchor":"middle", fill:"var(--ink-3)",
    "font-size":13}, svg);
  t.textContent = msg;
  const t2 = el("text", {x:W/2, y:H/2 + 18, "text-anchor":"middle", fill:"var(--ink-3)",
    "font-size":11.5}, svg);
  t2.textContent = "nothing plotted — this is not a value of zero";
  return svg;
}
const allNull = (series) => series.every(s => s.values.every(v => v === null));

function axisFmt(v, kind){
  if (kind === "usd0" || kind === "usd2") return compactUSD(v);
  if (kind === "pct" || kind === "pct2")  return Math.round(v) + "%";
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v % 1000 === 0 ? 0 : 1) + "k";
  return String(Math.round(v));
}

/* Column chart: one or more series, grouped. */
function columnChart(host, opts){
  const {labels, series, kind = "int", highlight = -1, height = 210} = opts;
  if (allNull(series)) return emptyChart(host, opts.emptyMsg || "No data to plot", height);
  const W = Math.max(host.clientWidth || 520, 300), H = height;
  const p = CHART_PAD;
  const innerW = W - p.l - p.r, innerH = H - p.t - p.b;
  const allVals = series.flatMap(s => s.values.filter(v => v !== null));
  const sc = axisScale(allVals);
  const min = sc.min, max = sc.max;
  const span = max - min || 1;
  const yOf = (v) => p.t + innerH - (v - min) / span * innerH;

  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img",
    "aria-label":opts.aria || "chart"}, host);

  /* grid + y labels */
  tickValues(sc).forEach(v => {
    const y = yOf(v);
    el("line", {x1:p.l, x2:W-p.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}, svg);
    const t = el("text", {x:p.l-9, y:y+4, "text-anchor":"end", fill:"var(--ink-3)",
      "font-size":11, "font-family":"var(--mono)"}, svg);
    t.textContent = axisFmt(v, kind);
  });
  el("line", {x1:p.l, x2:W-p.r, y1:yOf(Math.max(min,0)), y2:yOf(Math.max(min,0)),
    stroke:"var(--axis)", "stroke-width":1}, svg);

  const n = labels.length;
  const slot = innerW / n;
  const groupW = Math.min(slot * 0.66, 46);
  const gap = 2;                                  /* surface gap between bars */
  const barW = series.length > 1
    ? Math.max(3, (groupW - gap * (series.length - 1)) / series.length)
    : groupW;

  labels.forEach((lab, i) => {
    const gx = p.l + slot * i + (slot - groupW) / 2;

    if (i === highlight){
      el("rect", {x:p.l + slot*i + 1, y:p.t - 6, width:slot - 2, height:innerH + 8,
        fill:"#eff4fa", rx:6}, svg);
    }

    series.forEach((s, si) => {
      const v = s.values[i];
      if (v === null) return;
      const x = gx + si * (barW + gap);
      const y0 = yOf(Math.max(min, 0)), y1 = yOf(v);
      const top = Math.min(y0, y1), h = Math.abs(y1 - y0);
      const path = el("path", {d:barPath(x, top, barW, h, 4), fill:s.color,
        opacity: highlight === -1 || i === highlight ? 1 : .55}, svg);
      path.style.cursor = "default";
      path.addEventListener("mouseenter", ev => {
        const rows = series.map(ss => ss.values[i] === null ? "" :
          `<div class="tip-r"><i style="background:${ss.color}"></i>${esc(ss.name)}<b>${fmt(ss.values[i], kind)}</b></div>`).join("");
        showTip(`<div class="tip-t">${esc(lab)}</div>${rows}`, ev.clientX, ev.clientY);
      });
      path.addEventListener("mousemove", ev => showTip(tip.innerHTML, ev.clientX, ev.clientY));
      path.addEventListener("mouseleave", hideTip);
    });

    /* x labels — thin out when crowded */
    const everyOther = n > 8 && innerW / n < 46;
    if (!everyOther || i % 2 === 0 || i === highlight){
      const t = el("text", {x:p.l + slot*i + slot/2, y:H - 10, "text-anchor":"middle",
        fill: i === highlight ? "var(--ink)" : "var(--ink-3)", "font-size":11,
        "font-weight": i === highlight ? 700 : 400}, svg);
      t.textContent = lab;
    }
  });

  /* direct label on the highlighted column — relief for low-contrast fills */
  if (highlight >= 0 && series.length === 1 && series[0].values[highlight] !== null){
    const v = series[0].values[highlight];
    const x = p.l + slot*highlight + slot/2;
    const t = el("text", {x, y:yOf(v) - 8, "text-anchor":"middle", fill:"var(--ink)",
      "font-size":12, "font-weight":700}, svg);
    t.textContent = fmt(v, kind);
  }
  return svg;
}

/* Line chart with crosshair + nearest-point tooltip. */
function lineChart(host, opts){
  const {labels, series, kind = "int", height = 210, highlight = -1} = opts;
  if (allNull(series)) return emptyChart(host, opts.emptyMsg || "No data to plot", height);
  const W = Math.max(host.clientWidth || 520, 300), H = height;
  const p = CHART_PAD;
  const innerW = W - p.l - p.r, innerH = H - p.t - p.b;
  const vals = series.flatMap(s => s.values.filter(v => v !== null));
  const sc = axisScale(vals);
  const min = sc.min, max = sc.max;
  const span = max - min || 1;
  const n = labels.length;
  const xOf = (i) => p.l + (n === 1 ? innerW/2 : innerW * i / (n - 1));
  const yOf = (v) => p.t + innerH - (v - min) / span * innerH;

  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria || "trend"}, host);

  tickValues(sc).forEach(v => {
    const y = yOf(v);
    el("line", {x1:p.l, x2:W-p.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}, svg);
    const t = el("text", {x:p.l-9, y:y+4, "text-anchor":"end", fill:"var(--ink-3)",
      "font-size":11, "font-family":"var(--mono)"}, svg);
    t.textContent = axisFmt(v, kind);
  });
  if (min < 0){
    el("line", {x1:p.l, x2:W-p.r, y1:yOf(0), y2:yOf(0), stroke:"var(--axis)",
      "stroke-width":1, "stroke-dasharray":"3 3"}, svg);
  }

  series.forEach(s => {
    /* break the line across gaps rather than bridging missing months */
    let d = "", open = false;
    s.values.forEach((v,i) => {
      if (v === null){ open = false; return; }
      d += (open ? " L" : " M") + xOf(i) + " " + yOf(v);
      open = true;
    });
    if (d) el("path", {d:d.trim(), fill:"none", stroke:s.color, "stroke-width":2,
      "stroke-linejoin":"round", "stroke-linecap":"round"}, svg);

    /* emphasized endpoint */
    const lastIdx = s.values.reduce((acc,v,i) => v !== null ? i : acc, -1);
    if (lastIdx >= 0){
      el("circle", {cx:xOf(lastIdx), cy:yOf(s.values[lastIdx]), r:4.5, fill:s.color,
        stroke:"var(--surface)", "stroke-width":2}, svg);
    }
  });

  labels.forEach((lab,i) => {
    const everyOther = n > 8 && innerW / n < 46;
    if (!everyOther || i % 2 === 0 || i === highlight){
      const t = el("text", {x:xOf(i), y:H-10, "text-anchor":"middle",
        fill: i === highlight ? "var(--ink)" : "var(--ink-3)", "font-size":11,
        "font-weight": i === highlight ? 700 : 400}, svg);
      t.textContent = lab;
    }
  });

  /* hover layer: crosshair + dots at the nearest index */
  const cross = el("line", {y1:p.t, y2:p.t+innerH, stroke:"var(--axis)",
    "stroke-width":1, opacity:0}, svg);
  const dots = series.map(s => el("circle", {r:5, fill:s.color, stroke:"var(--surface)",
    "stroke-width":2, opacity:0}, svg));
  const hit = el("rect", {x:p.l, y:p.t, width:innerW, height:innerH, fill:"transparent"}, svg);
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX - box.left) / box.width * W;
    let i = Math.round((rel - p.l) / (innerW / Math.max(1, n-1)));
    i = Math.max(0, Math.min(n-1, i));
    if (series.every(s => s.values[i] === null)){ hideTip(); cross.setAttribute("opacity",0);
      dots.forEach(d => d.setAttribute("opacity",0)); return; }
    cross.setAttribute("x1", xOf(i)); cross.setAttribute("x2", xOf(i));
    cross.setAttribute("opacity", 1);
    series.forEach((s,si) => {
      if (s.values[i] === null){ dots[si].setAttribute("opacity",0); return; }
      dots[si].setAttribute("cx", xOf(i)); dots[si].setAttribute("cy", yOf(s.values[i]));
      dots[si].setAttribute("opacity", 1);
    });
    const rows = series.map(s => s.values[i] === null ? "" :
      `<div class="tip-r"><i style="background:${s.color}"></i>${esc(s.name)}<b>${fmt(s.values[i], kind)}</b></div>`).join("");
    showTip(`<div class="tip-t">${esc(labels[i])}</div>${rows}`, ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => {
    hideTip(); cross.setAttribute("opacity",0); dots.forEach(d => d.setAttribute("opacity",0));
  });
  return svg;
}

/* Horizontal bars — one measure across many categories, so colour carries
   magnitude (single hue), not identity. No legend needed. */
function barsH(host, opts){
  const {rows, kind = "int", height} = opts;   // rows: [{label, value}]
  const rowH = 26, padT = 6, padB = 6, labelW = 122, valueW = 68;
  const W = Math.max(host.clientWidth || 520, 300);
  const H = height || (rows.length * rowH + padT + padB);
  const trackX = labelW + 8;
  const trackW = Math.max(40, W - trackX - valueW - 6);
  const max = axisScale(rows.map(r => r.value)).max;

  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria || "ranking"}, host);

  rows.forEach((r,i) => {
    const y = padT + i * rowH;
    const t = el("text", {x:labelW, y:y + rowH/2 + 4, "text-anchor":"end",
      fill:"var(--ink-2)", "font-size":12}, svg);
    t.textContent = r.label;
    el("rect", {x:trackX, y:y+5, width:trackW, height:rowH-14, fill:"#f0f3f7", rx:4}, svg);
    const w = max ? Math.max(r.value > 0 ? 3 : 0, r.value / max * trackW) : 0;
    if (w > 0){
      const bar = el("rect", {x:trackX, y:y+5, width:w, height:rowH-14,
        fill:"var(--s1)", rx:4}, svg);
      bar.addEventListener("mouseenter", ev => showTip(
        `<div class="tip-t">${esc(r.label)}</div><div class="tip-r"><i style="background:var(--s1)"></i>${esc(opts.measure || "Value")}<b>${fmt(r.value, kind)}</b></div>`,
        ev.clientX, ev.clientY));
      bar.addEventListener("mousemove", ev => showTip(tip.innerHTML, ev.clientX, ev.clientY));
      bar.addEventListener("mouseleave", hideTip);
    }
    const vt = el("text", {x:W-4, y:y + rowH/2 + 4, "text-anchor":"end", fill:"var(--ink)",
      "font-size":12, "font-weight":600, "font-family":"var(--mono)"}, svg);
    vt.textContent = fmt(r.value, kind);
  });
  return svg;
}

/* Chart hosts are re-rendered on resize so the SVG viewBox tracks the column. */
const CHART_REGISTRY = [];
function mountChart(hostId, drawFn){
  const host = document.getElementById(hostId);
  if (!host) return;
  drawFn(host);
  CHART_REGISTRY.push({host, drawFn});
}
let resizeT = null;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => CHART_REGISTRY.forEach(c => {
    if (c.host.isConnected) c.drawFn(c.host);
  }), 140);
});
function resetCharts(){ CHART_REGISTRY.length = 0; }

/* =========================================================================
   7. MONTHLY SERIES for the trend charts
      Trends always span the report year regardless of the month filter, with
      the selected month highlighted — a one-bar "trend" is not a trend.
   ========================================================================= */

function monthlySeries(source){
  const out = [];
  MONTHS.filter(mo => mo.y === REPORT_YEAR).forEach(mo => {
    const r = {from:startOfMonth(mo.y,mo.m), to:endOfMonth(mo.y,mo.m)};
    const a = aggregate(r, source);
    const hasData = a.leads > 0 || a.spend > 0 || a.calls > 0;
    out.push({label:MONTH_NAMES[mo.m].slice(0,3), key:mo.key, agg:a, hasData});
  });
  return out;
}
const seriesVals = (ms, fn) => ms.map(m => m.hasData ? fn(m.agg) : null);

function highlightIndex(){
  if (state.month === "All Months") return -1;
  const [y,m] = state.month.split("-").map(Number);
  return y === REPORT_YEAR ? m - 1 : -1;
}

/* ---- shared filter bar ---- */
function filterBar(){
  const months = monthOptions();
  const monthOpts = months.map(m => {
    if (m === "All Months")
      return `<option value="All Months"${state.month==="All Months"?" selected":""}>All Months</option>`;
    const sel = state.month === m.key ? " selected" : "";
    return `<option value="${m.key}"${sel}>${esc(m.label)}${m.hasData ? "" : " (no data)"}</option>`;
  }).join("");

  const cur = currentRange(), prev = compareRange(cur);
  const custom = state.compare === "Custom Period";

  return `<section class="filters" aria-label="Report filters">
    <div class="filter-row">
      <div class="field">
        <label for="fSource">Source</label>
        <select id="fSource">
          <option${state.source===ALL_SOURCES?" selected":""}>${ALL_SOURCES}</option>
          ${SOURCES.map(s => `<option${state.source===s?" selected":""}>${esc(s)}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label for="fMonth">Report Month</label>
        <select id="fMonth">${monthOpts}</select>
      </div>
      <div class="field">
        <label for="fCompare">Compare To</label>
        <select id="fCompare">
          ${COMPARE_MODES.map(c => `<option${state.compare===c?" selected":""}>${esc(c)}</option>`).join("")}
        </select>
      </div>

function wireFilters(){

/* ---- 8b. Source performance table ---- */
const SRC_COLS = [
  {key:"source",       label:"Source",          fmt:null,   w:"left"},
  {key:"spend",        label:"Spend",           fmt:"usd0"},
  {key:"calls",        label:"Calls",           fmt:"int"},
  {key:"leads",        label:"Leads",           fmt:"int"},
  {key:"qualified",    label:"Qualified",       fmt:"int"},
  {key:"appointments", label:"Appts",           fmt:"int"},
  {key:"offers",       label:"Offers",          fmt:"int"},
  {key:"contracts",    label:"Contracts",       fmt:"int"},
  {key:"acquisitions", label:"Acquisitions",    fmt:"int"},
  {key:"gross",        label:"Revenue",         fmt:"usd0"},
  {key:"cpl",          label:"CPL",             fmt:"usd2"},
  {key:"cpa",          label:"CPA",             fmt:"usd0"},
  {key:"roi",          label:"ROI",             fmt:"pct"}
];

function sourceRows(){
  const cur = currentRange();
  const q = state.srcQuery.trim().toLowerCase();
  let rows = SOURCES.map(s => Object.assign({source:s}, aggregate(cur, s)));
  if (q) rows = rows.filter(r => r.source.toLowerCase().includes(q));
  const {col, dir} = state.srcSort;
  rows.sort((a,b) => {
    const av = a[col], bv = b[col];
    if (typeof av === "string") return av.localeCompare(bv) * dir;
    const an = av === null ? -Infinity : av, bn = bv === null ? -Infinity : bv;
    return (an - bn) * dir;
  });
  return rows;
}

function sourceTable(opts){
  const paginate = !!opts.paginate;
  const perPage = 6;
  let rows = sourceRows();
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / perPage));
  if (state.srcPage > pages) state.srcPage = pages;
  const shown = paginate ? rows.slice((state.srcPage-1)*perPage, state.srcPage*perPage) : rows;

  const totalsAgg = aggregate(currentRange(), ALL_SOURCES);

  const head = SRC_COLS.map(c => {
    const active = state.srcSort.col === c.key;
    const sort = active ? ` aria-sort="${state.srcSort.dir === 1 ? "ascending" : "descending"}"` : "";
    const arrow = active ? (state.srcSort.dir === 1 ? "▲" : "▼") : "▾";
    return `<th class="sortable" data-col="${c.key}"${sort}>${esc(c.label)} <span class="arrow">${arrow}</span></th>`;
  }).join("");

  const body = shown.map(r => `<tr class="clickable" data-src="${esc(r.source)}">
    ${SRC_COLS.map(c => {
      if (c.key === "source")
        return `<td><span class="src-cell"><i style="background:${
          hasCostData(r.source) ? "var(--s1)" : "var(--ink-3)"}"></i>${esc(r.source)}</span></td>`;
      /* cost columns stay blank, with a reason, where no costing was supplied */
      if (COST_KPI_KEYS.has(c.key) && !r.costKnown)
        return `<td title="awaiting costing" style="color:var(--ink-3)">${DASH}</td>`;
      const v = r[c.key];
      let cls = "";
      if (c.key === "roi" && v !== null) cls = v >= 0 ? "pos" : "neg";
      return `<td class="${cls}">${fmt(v, c.fmt)}</td>`;
    }).join("")}
  </tr>`).join("");

  const totalRow = `<tr class="total">
    ${SRC_COLS.map(c => {
      if (c.key === "source") return `<td>All Sources</td>`;
      if (COST_KPI_KEYS.has(c.key) && !totalsAgg.costKnown)
        return `<td title="no company total until every source has costing" style="color:var(--ink-3);font-weight:400">${DASH}</td>`;
      const v = totalsAgg[c.key];
      let cls = "";
      if (c.key === "roi" && v !== null) cls = v >= 0 ? "pos" : "neg";
      return `<td class="${cls}">${fmt(v, c.fmt)}</td>`;
    }).join("")}
  </tr>`;

  return `
  <div class="table-tools">
    <input type="search" id="srcSearch" placeholder="Search source" value="${esc(state.srcQuery)}" aria-label="Search source">
    <button class="btn" id="srcExport" type="button">Export CSV</button>
    ${state.source !== ALL_SOURCES
      ? `<button class="btn" id="srcClear" type="button">Clear source filter (${esc(state.source)})</button>` : ""}
    <span class="spacer"></span>
    <span style="font-size:13px;color:var(--ink-3)">${total} source${total===1?"":"s"} · ${esc(currentRange().label)}</span>
  </div>
  <div class="t-scroll"><table>
    <caption class="sr-only" style="position:absolute;left:-9999px">Source performance for ${esc(currentRange().label)}</caption>
    <thead><tr>${head}</tr></thead>
    <tbody>${body || `<tr><td colspan="${SRC_COLS.length}" style="text-align:center;color:var(--ink-3);padding:22px">No source matches that search.</td></tr>`}${shown.length ? totalRow : ""}</tbody>
  </table></div>
  ${paginate && pages > 1 ? `<div class="pager">
    <button class="btn" id="srcPrev" type="button"${state.srcPage===1?" disabled":""}>Previous</button>
    <span>Page ${state.srcPage} of ${pages}</span>
    <button class="btn" id="srcNext" type="button"${state.srcPage===pages?" disabled":""}>Next</button>
  </div>` : ""}`;
}

function wireSourceTable(root){
  root.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (state.srcSort.col === col) state.srcSort.dir *= -1;
    else state.srcSort = {col, dir: col === "source" ? 1 : -1};
    render();
  }));
  root.querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click", () => {
    state.source = tr.dataset.src; state.page = "dashboard"; render();
  }));
  const s = root.querySelector("#srcSearch");
  if (s) s.addEventListener("input", e => {
    state.srcQuery = e.target.value; state.srcPage = 1;
    render();
    const again = document.getElementById("srcSearch");
    if (again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  });
  const ex = root.querySelector("#srcExport");
  if (ex) ex.addEventListener("click", exportSourceCSV);
  const cl = root.querySelector("#srcClear");
  if (cl) cl.addEventListener("click", () => { state.source = ALL_SOURCES; render(); });
  const pv = root.querySelector("#srcPrev");
  if (pv) pv.addEventListener("click", () => { state.srcPage--; render(); });
  const nx = root.querySelector("#srcNext");
  if (nx) nx.addEventListener("click", () => { state.srcPage++; render(); });
}

function exportSourceCSV(){
  const rows = sourceRows();
  const header = SRC_COLS.map(c => c.label);
  const lines = [header.join(",")];
  rows.forEach(r => lines.push(SRC_COLS.map(c => {
    const v = r[c.key];
    if (c.key === "source") return `"${r.source}"`;
    if (v === null) return "";
    return typeof v === "number" ? (Math.round(v*100)/100) : v;
  }).join(",")));
  const totals = aggregate(currentRange(), ALL_SOURCES);
  lines.push(SRC_COLS.map(c => c.key === "source" ? '"All Sources"'
    : (totals[c.key] === null ? "" : Math.round(totals[c.key]*100)/100)).join(","));

  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `thb-source-performance-${currentRange().label.replace(/\s+/g,"-").toLowerCase()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    <p>${sample.length.toLocaleString("en-US")} individual call records in this period.</p></div>
  <div class="kpi-grid">
    ${statTile("Inbound", fmt(inbound,"int"), pctOf(inbound, sample.length))}
    ${statTile("Outbound", fmt(outbound,"int"), pctOf(outbound, sample.length))}
    ${statTile("First-Time Callers", fmt(firstTime,"int"), pctOf(firstTime, sample.length))}
    ${statTile("Appointments Booked", fmt(booked,"int"), pctOf(booked, sample.length))}
  </div>

  <div class="sec"><h2>Calls by month</h2></div>
  <div class="chart-grid">
    ${chartCard("chCallsMo","Calls By Month","inbound calls")}
    ${chartCard("chCallsAgent","Calls By Agent","sampled records")}
  </div>

  <div class="sec"><h2>Call log</h2><p>Most recent 40 records in the period.</p></div>
  <div class="t-scroll"><table>
    <thead><tr><th>Date</th><th>Caller</th><th>Source</th><th>Direction</th>
      <th>Agent</th><th>Caller Type</th><th>Outcome</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="7" style="text-align:center;color:var(--ink-3);padding:22px">No call records in this period.</td></tr>`}</tbody>
  </table></div>`;
}
function pctOf(n, d){ return d ? (n/d*100).toFixed(1) + "% of log" : ""; }
function statTile(title, value, sub){
  return `<article class="kpi">
    <p class="kpi-title">${esc(title)}</p>
    <p class="kpi-value">${value}</p>
    ${sub ? `<p class="kpi-prev">${esc(sub)}</p>` : ""}
  </article>`;
}
function drawCallsCharts(){
  const ms = monthlySeries(state.source);
  const labels = ms.map(m => m.label);
  mountChart("chCallsMo", h => columnChart(h, {labels, highlight:highlightIndex(), kind:"int",
    aria:"Calls by month", series:[{name:"Inbound Calls", color:"var(--s1)", values:seriesVals(ms, a => a.calls)}]}));

  const cur = currentRange();
  const srcFilter = (s) => state.source === ALL_SOURCES ? true : s === state.source;
  const sample = DATA.calls.filter(c => srcFilter(c.source) && inRange(c.date, cur));
  const rows = AGENTS.map(a => ({label:a, value:sample.filter(c => c.agent === a).length}))
                     .sort((x,y) => y.value - x.value);
  mountChart("chCallsAgent", h => barsH(h, {rows, kind:"int", measure:"Calls",
    aria:"Calls by agent"}));
}

/* ---- 8e. Deals ---- */
function pageDeals(){
  const cur = currentRange(), prevR = compareRange(cur);
  const A = aggregate(cur, state.source);
  const B = prevR ? aggregate(prevR, state.source) : null;

  const stages = [
    {name:"Inbound Calls",  v:A.calls,        c:"var(--o1)"},
    {name:"Leads",          v:A.leads,        c:"var(--o2)"},
    {name:"Qualified Leads",v:A.qualified,    c:"var(--o3)"},
    {name:"Appointments",   v:A.appointments, c:"var(--o4)"},
    {name:"Offers Made",    v:A.offers,       c:"var(--o5)"},
    {name:"Contracts",      v:A.contracts,    c:"var(--o6)"},
    {name:"Acquired",       v:A.acquisitions, c:"var(--o7)"}
  ];
  const top = Math.max(...stages.map(s => s.v), 1);

  const srcFilter = (s) => state.source === ALL_SOURCES ? true : s === state.source;
  const deals = DATA.leads.filter(l => srcFilter(l.marketing_source) && inRange(l.date, cur)
    && (l.appointment || l.contract || l.acquisition)).slice(0, 30);

  const dealRows = deals.map(d => `<tr>
    <td>${esc(d.property_address)}, ${esc(d.city)}</td>
    <td>${esc(d.caller_name)}</td>
    <td>${esc(d.marketing_source)}</td>
    <td style="font-size:12.5px">${esc(d.campaign)}</td>
    <td>${statusPill(d.lead_status)}</td>
    <td>${d.gross_revenue ? "$" + d.gross_revenue.toLocaleString("en-US") : DASH}</td>
    <td>${d.net_revenue ? "$" + d.net_revenue.toLocaleString("en-US") : DASH}</td>
  </tr>`).join("");

  return `${filterBar()}
  <div class="page-head"><h2>Deals</h2>
    <p>Lead to acquisition for ${esc(state.source)} in ${esc(cur.label)}. This is the funnel the
       dashboard exists to answer: which sources produce qualified seller opportunities,
       acquisitions, revenue and profitable ROI.</p></div>

  <div class="kpi-grid hero" style="margin-top:14px">
    ${kpiCard({key:"acquisitions",title:"Acquired Properties",fmt:"int",dir:"up"}, A, B)}
    ${kpiCard({key:"cpa",title:"Cost Per Acquisition",fmt:"usd0",dir:"down"}, A, B)}
    ${kpiCard({key:"net",title:"Net Revenue",fmt:"usd0",dir:"up"}, A, B)}
    ${kpiCard({key:"roi",title:"ROI",fmt:"pct",dir:"up"}, A, B)}
  </div>

  <div class="sec"><h2>Funnel</h2>
    <p>Each stage is nested inside the one above it, so the funnel can never invert.</p></div>
  <section class="card">
    <div class="funnel">
      ${stages.map((s,i) => {
        const prev = i ? stages[i-1].v : null;
        const conv = prev ? (prev ? (s.v/prev*100) : null) : null;
        return `<div class="fstage">
          <span class="fname">${esc(s.name)}</span>
          <div class="fbar-track"><div class="fbar" style="width:${(s.v/top*100).toFixed(2)}%;background:${s.c}"></div></div>
          <span class="fnum"><b>${s.v.toLocaleString("en-US")}</b>${
            conv !== null && isFinite(conv) ? ` · ${conv.toFixed(1)}% of prior` : ""}</span>
        </div>`;
      }).join("")}
    </div>
    <p class="chart-note">Marketing Spend (${fmt(A.spend,"usd0")}) and Revenue
      (${fmt(A.gross,"usd0")} gross / ${fmt(A.net,"usd0")} net) are money rather than counts,
      so they are reported as figures above rather than drawn as funnel stages.</p>
  </section>

  <div class="sec"><h2>Live and closed deals</h2>
    <p>Records that reached appointment or beyond. Showing ${deals.length}.</p></div>
  <div class="t-scroll"><table>
    <thead><tr><th>Property</th><th>Seller</th><th>Source</th><th>Campaign</th>
      <th>Stage</th><th>Gross</th><th>Net</th></tr></thead>
    <tbody>${dealRows || `<tr><td colspan="7" style="text-align:center;color:var(--ink-3);padding:22px">No deals reached appointment stage in this period.</td></tr>`}</tbody>
  </table></div>`;
}
function statusPill(s){
  const cls = s === "Acquired" ? "won"
            : s === "Dead" ? "dead"
            : (s === "Under Contract" || s === "Offer Made") ? "live" : "";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

/* ---- notices ---- */
const ICON_INFO = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v5M8 4.6v.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const ICON_WARN = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l6.2 11.4H1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2v3.4M8 11.4v.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
function notice(kind, html, raw){
  const icon = kind === "warn" ? ICON_WARN : ICON_INFO;
  const body = raw ? html : `<p>${html}</p>`;
  return `<div class="notice ${kind}" role="note">${icon}<div>${body}</div></div>`;
}

/* =========================================================================
   9. RENDER + ROUTING
   ========================================================================= */

function render(){
  resetCharts();
  hideTip();
  const main = document.getElementById("main");

  switch(state.page){
    case "dashboard": main.innerHTML = pageDashboard(); break;
    case "source":    main.innerHTML = pageSource();    break;
    case "postcard":  main.innerHTML = pagePostcard();  break;
    case "calls":     main.innerHTML = pageCalls();     break;
    case "deals":     main.innerHTML = pageDeals();     break;
    case "sync":      main.innerHTML = pageSync();      break;
    case "admin":     main.innerHTML = pageAdmin();     break;
  }
  renderRail();
  wireFilters();

  if (state.page === "dashboard"){
    const holder = document.getElementById("srcTableMini");
    if (holder){ holder.innerHTML = sourceTable({paginate:true}); wireSourceTable(holder); }
    drawDashboardCharts();
  }
  if (state.page === "source"){
    const holder = document.getElementById("srcTableFull");
    if (holder){ holder.innerHTML = sourceTable({paginate:false}); wireSourceTable(holder); }
    const cur = currentRange();
    const rows = SOURCES.map(s => ({label:s, value:aggregate(cur, s).leads}))
                        .sort((a,b) => b.value - a.value);
    mountChart("chSrcRank", h => barsH(h, {rows, kind:"int", measure:"Leads",
      aria:"Leads by marketing source"}));
  }
  if (state.page === "postcard") drawPostcardCharts();
  if (state.page === "calls")    drawCallsCharts();
}

/* Default the report month to the most recent COMPLETE month. The current
   month is always partial, and opening on a part-month makes every card read
   red against a full prior month — a reporting artefact, not performance.
   The partial month stays selectable, and is labelled as such. */
(function initMonth(){
  const complete = MONTHS.filter(mo =>
    mo.y === REPORT_YEAR && monthScale(mo) > 0 && endOfMonth(mo.y, mo.m) < TODAY);
  const last = complete[complete.length - 1];
  if (last) state.month = last.key;
})();

render();
</script>
