<script>
"use strict";

/* =========================================================================
   1. TAXONOMY — Master Source to Standard CRM Source, exactly as supplied.
      8 master sources, 19 standard CRM sources. No names added or renamed.
   ========================================================================= */

const TAXONOMY = {
  "Direct Mail":       ["Direct Mail - Postcard","Direct Mail - Letter","Direct Mail - Check"],
  "PPC":               ["PPC - Google - Call","PPC - Google - Web Form",
                        "PPC - Bing - Call","PPC - Bing - Web Form"],
  "Organic Search":    ["Organic - SEO - Call","Organic - SEO - Web Form"],
  "PPL":               ["PPL - Motivated Leads","PPL - Property Leads"],
  "Referral":          ["Referral - Realtor / Professional","Referral - Personal / Word of Mouth"],
  "TV":                ["TV - Commercial - Call","TV - Commercial - Web Form"],
  "Outbound Outreach": ["Outbound - Realtor Email","Outbound - Homeowner Text",
                        "Outbound - Homeowner Cold Call"],
  "MLS / Redfin":      ["MLS / Redfin"]
};
const MASTERS = Object.keys(TAXONOMY);
const ALL_LEAVES = MASTERS.flatMap(m => TAXONOMY[m]);
const ALL_MASTERS = "All Master Sources";
const ALL_LEAF = "All CRM Sources";
const NEEDS_REVIEW = "Needs Review";

/* MLS / Redfin has one CRM source with the same name as its master, so there is
   nothing to choose between — its Standard CRM Source control is suppressed. */
const hasChoice = (master) => (TAXONOMY[master] || []).length > 1;

const MASTER_OF = {};
MASTERS.forEach(m => TAXONOMY[m].forEach(l => { MASTER_OF[l] = m; }));

const MONTH_NAMES = ["January","February","March","April","May","June",
                     "July","August","September","October","November","December"];
const COMPARE_MODES = ["Previous Month","Previous 30 Days","Previous 60 Days",
                       "Previous 90 Days","Same Month Last Year","Custom Period"];

const DATA_START = {y:2025, m:0};
const TODAY = new Date(2026, 7, 11);
const REPORT_YEAR = 2026;

const STD_FIELDS = ["date","caller_name","phone_number","email","property_address","city",
  "state","zip","campaign","contact_method","master_source","crm_source","lead_status",
  "disposition","qualified","appointment","offer","contract","acquisition",
  "marketing_cost","gross_revenue","net_revenue"];

/* =========================================================================
   2. MARKETING COST — REAL DATA
      Cost is supplied, never modelled. The only costed channels are the two
      Red Stone mail formats. Everything else awaits a figure.
   ========================================================================= */

const REDSTONE_JOBS = [
  {name:"THB_Postcard_Relaunch_01",          job:"281322", fmt:"Postcard", status:"Done",     upload:"2026-05-09", mail:"2026-05-16", qty:996,  cost:609.31},
  {name:"THB_Postcard_Relaunch_02",          job:"281822", fmt:"Postcard", status:"Done",     upload:"2026-05-13", mail:"2026-05-18", qty:1784, cost:920.73},
  {name:"THB_Postcard_Relaunch_03",          job:"282621", fmt:"Postcard", status:"Done",     upload:"2026-05-20", mail:"2026-05-27", qty:972,  cost:600.52},
  {name:"THB_Postcard_Relaunch_04",          job:"282914", fmt:"Postcard", status:"Done",     upload:"2026-05-22", mail:"2026-06-02", qty:1996, cost:1015.72},
  {name:"THB_Postcard_Relaunch_05",          job:"283693", fmt:"Postcard", status:"Done",     upload:"2026-05-29", mail:"2026-06-06", qty:2685, cost:1334.60},
  {name:"THB_Postcard_Relaunch_06",          job:"284126", fmt:"Postcard", status:"Done",     upload:"2026-06-02", mail:"2026-06-11", qty:8244, cost:3906.76},
  {name:"THB_Letter_01",                     job:"284128", fmt:"Letter",   status:"Done",     upload:"2026-06-02", mail:"2026-06-11", qty:293,  cost:327.83},
  {name:"THB_Postcard_Relaunch_07",          job:"285043", fmt:"Postcard", status:"Done",     upload:"2026-06-10", mail:"2026-06-18", qty:8643, cost:4111.19},
  {name:"THB_Postcard_Relaunch_08",          job:"285989", fmt:"Postcard", status:"Done",     upload:"2026-06-18", mail:"2026-06-25", qty:3674, cost:1769.39},
  {name:"THB_Postcard_Relaunch_Followup_01", job:"285990", fmt:"Postcard", status:"Done",     upload:"2026-06-18", mail:"2026-06-25", qty:5734, cost:2807.90},
  {name:"THB_Postcard_Relaunch_09",          job:"287106", fmt:"Postcard", status:"Done",     upload:"2026-06-26", mail:"2026-07-07", qty:4032, cost:1599.55},
  {name:"THB_Postcard_Relaunch_Followup_02", job:"287141", fmt:"Postcard", status:"Done",     upload:"2026-06-26", mail:"2026-07-07", qty:8750, cost:4274.54},
  {name:"THB_Postcard_Relaunch_10",          job:"289244", fmt:"Postcard", status:"Done",     upload:"2026-07-13", mail:"2026-07-17", qty:2843, cost:1376.02},
  {name:"THB_Postcard_Relaunch_11",          job:"290763", fmt:"Postcard", status:"Done",     upload:"2026-07-28", mail:"2026-08-01", qty:4583, cost:2214.38},
  {name:"THB_Postcard_Relaunch_12",          job:"291195", fmt:"Postcard", status:"Done",     upload:"2026-07-30", mail:null,         qty:3171, cost:1672.15},
  {name:"THB_Postcard_Relaunch_13",          job:"291483", fmt:"Postcard", status:"Uploaded", upload:"2026-08-03", mail:null,         qty:3515, cost:1947.49}
];

/* Only jobs the board marks Done count as mailed. Relaunch_13 is still in
   production: committed cost, pieces not out. Counting it would overstate
   Postcards Mailed for August by 3,515 pieces. */
const MAILED_JOBS   = REDSTONE_JOBS.filter(j => j.status === "Done");
const IN_PRODUCTION = REDSTONE_JOBS.filter(j => j.status !== "Done");
const POSTCARD_JOBS = MAILED_JOBS.filter(j => j.fmt === "Postcard");
const LETTER_JOBS   = MAILED_JOBS.filter(j => j.fmt === "Letter");

function jobDate(j){
  return {date:new Date((j.mail || j.upload) + "T00:00:00"), estimated:!j.mail};
}
const mKey = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");

/* Costing registry, keyed by Standard CRM Source. */

const norm = s => (s||"").toLowerCase().replace(/[_\-./]+/g," ").replace(/\s+/g," ").trim();

/* Call vs Web Form. Campaign wording wins; otherwise the recorded method. */
function contactMethod(campaign, field){
  const n = norm(campaign);
  if (/\b(web ?form|website form|contact form|online form|form)\b/.test(n)) return "Web Form";
  if (/\b(inbound call|call in|called|phone|call)\b/.test(n))               return "Call";
  if (field === "Call" || field === "Web Form")                             return field;
  return null;
}

/* Ordered rules. `split` marks families whose leaf depends on contact method.
   Specific outbound channels precede the generic outbound marker, so
   "Realtor Email Outreach" is outbound rather than a referral. */
const FAMILIES = [
  [/\b(realtor|agent|broker|professional)\b[^|]*\bemail\b|\bemail\b[^|]*\b(realtor|agent|broker|professional)\b/,
                                     "Outbound Outreach","Outbound - Realtor Email",       "realtor email outreach"],
  [/\bcold ?call/,                   "Outbound Outreach","Outbound - Homeowner Cold Call", "cold call"],
  [/\b(sms|text blast|texting|smarter contact)\b/,
                                     "Outbound Outreach","Outbound - Homeowner Text",      "sms / text"],
  [/\boutbound\b|\bemail outreach\b|\bdrip\b/,
                                     "Outbound Outreach", null,                            "outbound marker"],
  [/\b(mls|redfin)\b/,               "MLS / Redfin","MLS / Redfin",                        "mls / redfin"],
  [/\bmotivated ?leads\b/,           "PPL","PPL - Motivated Leads",                        "motivated leads vendor"],
  [/\bproperty ?leads\b|\bppl\b/,    "PPL","PPL - Property Leads",                         "property leads vendor"],
  [/\bgoogle ?ads?\b|\badwords\b|\bgads\b/,
                                     "PPC","PPC - Google",                                 "google paid", true],
  [/\bbing\b|\bmicrosoft ?ads?\b|\bmsn\b/,
                                     "PPC","PPC - Bing",                                   "bing paid",   true],
  [/\b(tv|television|broadcast)\b/,  "TV","TV - Commercial",                               "television",  true],
  [/\bpost ?cards?\b/,               "Direct Mail","Direct Mail - Postcard",               "postcard"],
  [/\bletters?\b/,                   "Direct Mail","Direct Mail - Letter",                 "letter"],
  [/\bchecks?\b/,                    "Direct Mail","Direct Mail - Check",                  "check mailer"],
  [/\b(word of mouth|past client|friend|family|acquaintance|personal referral)\b/,
                                     "Referral","Referral - Personal / Word of Mouth",     "personal referral"],
  [/\b(realtor|agent|broker|attorney|professional)\b[^|]*\breferral\b|\breferral\b[^|]*\b(realtor|agent|broker|attorney)\b/,
                                     "Referral","Referral - Realtor / Professional",       "professional referral"],
  [/\bseo\b|\borganic\b/,            "Organic Search","Organic - SEO",                     "seo / organic", true],
  [/\breferral\b/,                   "Referral","Referral - Personal / Word of Mouth",     "bare referral"]
];

/* Recognized platforms that the supplied map has no Standard CRM Source for.
   These are surfaced for a decision, never forced into a neighbouring bucket. */
const UNMAPPED = [
  [/\b(facebook|fb|meta|instagram)\b/, "Facebook / Meta Ads"],
  [/\breddit\b/,                       "Reddit Ads"],
  [/\bppc\b|\bpaid search\b|\bcpc\b/,  "paid search with no platform named"],
  [/\bdirect mail\b|\bmailer\b/,       "direct mail with no format named"],
  [/\b(web ?form|contact form)\b/,     "web form with no channel named"]
];

function classify(campaign, methodField){
  const n = norm(campaign);
  if (!n) return {review:true, reason:"campaign is empty"};
  for (const [re, master, leaf, why, split] of FAMILIES){
    if (!re.test(n)) continue;
    if (!split){
      if (leaf) return {master, leaf, matchedOn:why, review:false};
      return {master, review:true, reason:"outbound channel not identified", matchedOn:why};
    }
    const m = contactMethod(campaign, methodField);
    if (!m) return {master, review:true,
                    reason:"contact method unknown — Call or Web Form", matchedOn:why};
    return {master, leaf:leaf + " - " + m, matchedOn:why + " + " + m.toLowerCase(), review:false};
  }
  for (const [re, label] of UNMAPPED)
    if (re.test(n)) return {review:true, reason:"no Standard CRM Source defined for " + label};
  return {review:true, reason:"no campaign signal"};
}

  try {
    localStorage.setItem("thb_source_overrides", JSON.stringify([...OVERRIDES]));
  } catch(e){ /* non-fatal */ }
}
function setOverride(id, leaf){

}

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildMonths(){
  const out = []; let y = DATA_START.y, m = DATA_START.m;
  while (y < 2026 || (y === 2026 && m <= 11)){
    out.push({y, m, key:`${y}-${String(m+1).padStart(2,"0")}`});
    m++; if (m > 11){ m = 0; y++; }
  }
  return out;
}
const MONTHS = buildMonths();

function monthScale(mo){
  if (mo.y === 2026 && mo.m > 7) return 0;
  if (mo.y === 2026 && mo.m === 7) return 0.355;
  const idx = MONTHS.findIndex(x => x.key === mo.key);
  const growth = 0.62 + idx * 0.021;
  const season = 1 + Math.sin((mo.m + 1) / 12 * Math.PI * 2) * 0.10;
  return growth * season;
}

function buildDataset(){
  const leads = [], calls = [], volume = [];
  let seq = 1000, misclassifiedBySheet = 0;

  MONTHS.forEach(mo => {
    const scale = monthScale(mo);
    const perLeaf = {};

    CAMPAIGN_POOL.forEach(pool => {
      const n = scale === 0 ? 0 : Math.max(0, Math.round(pool.w * scale * jitter(.24)));
      for (let i = 0; i < n; i++){
        const campaign = pick(pool.names);
        const auto = classify(campaign, pool.method);
        const master = auto.master || "_review";
        const p = MASTER_PROFILE[master] || MASTER_PROFILE._review;

        const qualified   = rnd() < p.qual;
        const appointment = qualified   && rnd() < p.appt;
        const offer       = appointment && rnd() < p.offer;
        const contract    = offer       && rnd() < p.ctr;
        const acquisition = contract    && rnd() < p.acq;

        const day = 1 + Math.floor(rnd() * (mo.y===2026 && mo.m===7 ? 11 : 28));
        const [city, zip] = pick(CITIES);
        const first = pick(FIRST), last = pick(LAST);
        /* No revenue is generated. These stay null until real figures arrive —
           null means "not supplied", which is not the same as zero. */
        const net = null, gross = null;

        let status, disposition;
        if (acquisition)      { status="Acquired";       disposition="Qualified | Acquired"; }
        else if (contract)    { status="Under Contract"; disposition="Qualified | Contract"; }
        else if (offer)       { status="Offer Made";     disposition="Qualified | Offer"; }
        else if (appointment) { status="Appointment";    disposition="Qualified | Appointment"; }
        else if (qualified)   { status="Qualified";      disposition="Qualified | Working"; }
        else if (rnd() < .45) { status="Dead";           disposition=pick(DISPOSITIONS_DEAD); }
        else                  { status="Working";        disposition=pick(DISPOSITIONS_LIVE); }

        const sheetValue = pick(SHEET_VALUES);
        /* does the sheet's own label agree with the campaign-derived master? */
        const agrees = auto.master && norm(sheetValue) &&
                       norm(auto.master).split(" ")[0] === norm(sheetValue).split(" ")[0];
        if (!agrees) misclassifiedBySheet++;

        leads.push({
          lead_id:"L-" + (++seq),
          date:new Date(mo.y, mo.m, day),
          caller_name:first + " " + last,
          phone_number:"(510) " + (200+Math.floor(rnd()*700)) + "-" +
                        String(1000+Math.floor(rnd()*8999)).slice(0,4),
          email:first.toLowerCase() + "." + last.toLowerCase() + "@example.com",
          property_address:(100+Math.floor(rnd()*8900)) + " " + pick(STREETS),
          city, state:"CA", zip,
          campaign,
          contact_method:pool.method,
          sheet_lead_source:sheetValue,   /* untrusted, kept for reference only */
          auto,
          lead_status:status, disposition,
          qualified, appointment, offer, contract, acquisition,
          gross_revenue:gross, net_revenue:net
        });

        const key = auto.leaf || NEEDS_REVIEW;
        perLeaf[key] = (perLeaf[key] || 0) + 1;
      }
    });

    /* Call volume derives from lead volume per master source. */
    const byMaster = {};
    Object.keys(perLeaf).forEach(leaf => {
      const m = leaf === NEEDS_REVIEW ? "_review" : (MASTER_OF[leaf] || "_review");
      byMaster[m] = (byMaster[m] || 0) + perLeaf[leaf];
    });
    ALL_LEAVES.concat([NEEDS_REVIEW]).forEach(leaf => {
      const m = leaf === NEEDS_REVIEW ? "_review" : MASTER_OF[leaf];
      const p = MASTER_PROFILE[m] || MASTER_PROFILE._review;
      const n = perLeaf[leaf] || 0;
      const c = n ? Math.max(0, Math.round(n * p.calls * jitter(.18))) : 0;
      /* Inbound / outbound split. The 31% inbound share is measured from the
         real call logs (1,512 inbound of 4,878 total). Outbound Outreach is
         0% inbound by definition — those calls are ones THB places. */
      const inShare = m === "Outbound Outreach" ? 0 : 0.31;
      const cIn  = Math.round(c * inShare);
      const cOut = c - cIn;
      volume.push({monthKey:mo.key, leaf, calls:c, inbound:cIn, outbound:cOut,
                   unique_callers:c ? Math.round(c * (0.82 + rnd()*0.1)) : 0});
      for (let i = 0; i < Math.round(c * 0.22); i++){
        const day = 1 + Math.floor(rnd() * (mo.y===2026 && mo.m===7 ? 11 : 28));
        calls.push({date:new Date(mo.y, mo.m, day), leaf,
          direction: rnd() < 0.31 ? "Inbound" : "Outbound",
          agent:pick(AGENTS), caller_name:pick(FIRST) + " " + pick(LAST),
          first_time: rnd() < 0.58, appointment_booked: rnd() < 0.035});
      }
    });
  });

  leads.sort((a,b) => b.date - a.date);
  calls.sort((a,b) => b.date - a.date);
  return {leads, calls, volume, misclassifiedBySheet};
}

const dayMs = 86400000;

const endOfMonth   = (y,m) => new Date(y, m+1, 0);
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const iso = (d) => d.toISOString().slice(0,10);

function monthOptions(){

function selectedMonthPartial(){
  if (state.month === "All Months") return false;
  const m = monthOptions().find(o => o !== "All Months" && o.key === state.month);
  return !!(m && m.partial);
}
function currentRange(){
  if (state.month === "All Months")
    return {from:startOfMonth(REPORT_YEAR,0), to:endOfMonth(REPORT_YEAR,11),
            label:`All Months ${REPORT_YEAR}`};
  const [y,m] = state.month.split("-").map(Number);
  return {from:startOfMonth(y,m-1), to:endOfMonth(y,m-1), label:`${MONTH_NAMES[m-1]} ${y}`};
}
function compareRange(cur){
  const mode = state.compare;
  if (mode === "Custom Period"){
    const f = new Date(state.customFrom + "T00:00:00"), t = new Date(state.customTo + "T00:00:00");
    if (isNaN(f) || isNaN(t) || f > t) return null;
    return {from:f, to:t, label:`${iso(f)} to ${iso(t)}`};
  }
  if (mode === "Previous Month"){
    if (state.month === "All Months")
      return {from:startOfMonth(REPORT_YEAR-1,0), to:endOfMonth(REPORT_YEAR-1,11),
              label:`All Months ${REPORT_YEAR-1}`,
              note:"previous month is undefined for All Months — comparing with the prior year"};
    const p = new Date(cur.from.getFullYear(), cur.from.getMonth()-1, 1);
    return {from:startOfMonth(p.getFullYear(),p.getMonth()), to:endOfMonth(p.getFullYear(),p.getMonth()),
            label:`${MONTH_NAMES[p.getMonth()]} ${p.getFullYear()}`};
  }
  if (mode === "Same Month Last Year"){
    const y = cur.from.getFullYear()-1;
    if (state.month === "All Months")
      return {from:startOfMonth(y,0), to:endOfMonth(y,11), label:`All Months ${y}`};
    const m = cur.from.getMonth();
    return {from:startOfMonth(y,m), to:endOfMonth(y,m), label:`${MONTH_NAMES[m]} ${y}`};
  }
  const n = mode === "Previous 30 Days" ? 30 : mode === "Previous 60 Days" ? 60 : 90;
  const to = addDays(cur.from, -1);
  return {from:addDays(to, -(n-1)), to, label:`${n} days to ${iso(to)}`};
}

const safeDiv = (a,b) => (b && isFinite(a/b)) ? a/b : null;
const inRange = (d,r) => d >= r.from && d <= r.to;

function monthKeysIn(range){
  return MONTHS.filter(mo => endOfMonth(mo.y,mo.m) >= range.from &&
                             startOfMonth(mo.y,mo.m) <= range.to).map(mo => mo.key);
}
function monthOverlapFraction(monthKey, range){
  const [y,m] = monthKey.split("-").map(Number);
  const s = startOfMonth(y,m-1), e = endOfMonth(y,m-1);
  const from = range.from > s ? range.from : s, to = range.to < e ? range.to : e;
  if (to < from) return 0;
  return Math.min(1, (Math.round((to - from)/dayMs) + 1) / e.getDate());
}

/* Leaves in scope for the current filter selection.
   All Master Sources includes the review bucket: a total labelled "all" has to
   be all, or the company lead count silently drops every unclassified lead. */
function scopeLeaves(master, leaf){
  if (Array.isArray(leaf)) return leaf.slice();   /* explicit combined scope */
  if (master === ALL_MASTERS) return ALL_LEAVES.concat([NEEDS_REVIEW]);
  if (master === NEEDS_REVIEW) return [NEEDS_REVIEW];
  const subs = TAXONOMY[master] || [];
  if (leaf === ALL_LEAF || !leaf) return subs.slice();
  return subs.includes(leaf) ? [leaf] : subs.slice();
}

/* A cost total is shown only when EVERY leaf in scope has supplied costing.
   Otherwise it is withheld: a partial total understates real spend. */
function suppliedCost(range, master, leaf){
  const leaves = scopeLeaves(master, leaf).filter(l => l !== NEEDS_REVIEW);
  if (!leaves.length || !leaves.every(leafCosted)) return {cost:null, pieces:0, jobs:0, estimated:0};
  let cost = 0, pieces = 0, jobs = 0, estimated = 0;
  leaves.forEach(l => {
    const reg = COSTING[l];
    (reg.jobs || []).forEach(j => {
      const d = jobDate(j);
      if (d.date < range.from || d.date > range.to) return;
      cost += j.cost; pieces += j.qty; jobs++;
      if (d.estimated) estimated++;
    });
    if (!reg.jobs){
      monthKeysIn(range).forEach(k => {
        if (!reg.byMonth[k]) return;
        const f = monthOverlapFraction(k, range);
        cost += reg.byMonth[k].cost * f; pieces += reg.byMonth[k].pieces * f;
      });
    }
  });
  return {cost, pieces, jobs, estimated};
}

function aggregate(range, master, leaf){
  const scope = new Set(scopeLeaves(master, leaf));

  let calls = 0, inbound = 0, outbound = 0, uniqueCallers = 0;
  const keys = new Set(monthKeysIn(range));
  DATA.volume.forEach(v => {
    if (!keys.has(v.monthKey) || !scope.has(v.leaf)) return;
    const f = monthOverlapFraction(v.monthKey, range);
    calls += v.calls * f; inbound += v.inbound * f; outbound += v.outbound * f;
    uniqueCallers += v.unique_callers * f;
  });

  let leads=0, qualified=0, appointments=0, offers=0, contracts=0, acquisitions=0,
      gross=0, net=0, review=0, manual=0, sheetDisagrees=0;
  DATA.leads.forEach(l => {
    if (!inRange(l.date, range)) return;
    const r = resolved(l);
    const key = r.leaf || NEEDS_REVIEW;
    if (!scope.has(key)) return;
    leads++;
    if (r.review) review++;
    if (r.manual) manual++;
    if (l.qualified)   qualified++;
    if (l.appointment) appointments++;
    if (l.offer)       offers++;
    if (l.contract)    contracts++;
    if (l.acquisition) acquisitions++;
    if (REVENUE_SUPPLIED){ gross += l.gross_revenue || 0; net += l.net_revenue || 0; }
    const sm = norm(l.sheet_lead_source).split(" ")[0];
    if (!sm || !r.master || norm(r.master).split(" ")[0] !== sm) sheetDisagrees++;
  });

  const c = suppliedCost(range, master, leaf);
  const spend = c.cost, costKnown = spend !== null, mailed = c.pieces;

  return {
    costKnown, spend: costKnown ? Math.round(spend) : null,
    revenueKnown: REVENUE_SUPPLIED,
    /* Mail volume comes from the same Red Stone source as cost, so where no
       costing exists there is no piece count either — null, not zero. */
    mailed: costKnown ? Math.round(mailed) : null,
    calls: Math.round(calls),
    inbound: Math.round(inbound), outbound: Math.round(outbound),
    uniqueCallers: Math.round(uniqueCallers),
    leads, qualified, appointments, offers, contracts, acquisitions,
    gross: REVENUE_SUPPLIED ? gross : null,
    net:   REVENUE_SUPPLIED ? net   : null,
    review, manual, sheetDisagrees,
    /* A costed source with zero spend in the period (no job fell inside it) has
       no meaningful cost ratio. $0.00 per lead would read as "leads were free",
       so the ratios stay null while the spend itself still reports as $0. */
    cpl:  costKnown && spend > 0 ? safeDiv(spend, leads)        : null,
    cpql: costKnown && spend > 0 ? safeDiv(spend, qualified)    : null,
    cpa:  costKnown && spend > 0 ? safeDiv(spend, acquisitions) : null,
    cpc:  costKnown && spend > 0 ? safeDiv(spend, calls)        : null,
    /* ROI needs both sides. Real cost divided by absent revenue is not an ROI. */
    roi:  REVENUE_SUPPLIED && costKnown && spend > 0 ? (net - spend)/spend*100 : null,
    /* Two different rates, deliberately not the same number:
         Response Rate — every call touching the mail  / pieces mailed
         Call Rate     — INBOUND calls only            / pieces mailed
       Response Rate counts outbound follow-up on a mailed record; Call Rate
       counts only people who picked up the phone and called in. */
    responseRate: mailed > 0 ? calls/mailed*100 : null,
    callRate:     mailed > 0 ? inbound/mailed*100 : null,
    answerRate:   calls > 0 ? inbound/calls*100 : null,
    callsPerLead: safeDiv(calls, leads),
    perCaller:    safeDiv(mailed, uniqueCallers),
    costPerPiece: costKnown && spend > 0 ? safeDiv(spend, mailed) : null,
    jobs:c.jobs, estimatedJobs:c.estimated
  };
}

/* =========================================================================
   7. FORMATTING
   ========================================================================= */

const DASH = "—";
function fmt(v, kind){
  if (v === null || v === undefined || (typeof v === "number" && !isFinite(v))) return DASH;
  switch(kind){
    case "int":  return Math.round(v).toLocaleString("en-US");
    case "usd0": return "$" + Math.round(v).toLocaleString("en-US");
    case "usd2": return v >= 100 ? "$" + Math.round(v).toLocaleString("en-US") : "$" + v.toFixed(2);
    case "pct":  return v.toFixed(1) + "%";
    case "pct2": return v.toFixed(2) + "%";
    case "dec1": return v.toLocaleString("en-US",{maximumFractionDigits:1});
    default:     return String(v);
  }
}
function compactUSD(v){
  if (v === null) return DASH;
  const a = Math.abs(v);
  if (a >= 1e6) return "$" + (v/1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + Math.round(v/1e3) + "k";
  return "$" + Math.round(v);
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ARROW_UP   = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M4.5 1L8 6.5H1z" fill="currentColor"/></svg>';
const ARROW_DOWN = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><path d="M4.5 8L1 2.5h7z" fill="currentColor"/></svg>';
const DOT_FLAT   = '<svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true"><rect x="1" y="4" width="7" height="1.6" fill="currentColor"/></svg>';
const ICON_CLOCK = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 2.7V5l1.8 1.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
const ICON_INFO  = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v5M8 4.6v.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const ICON_WARN  = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l6.2 11.4H1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2v3.4M8 11.4v.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

function notice(kind, html, raw){
  return `<div class="notice ${kind}" role="note">${kind === "warn" ? ICON_WARN : ICON_INFO}<div>${
    raw ? html : "<p>" + html + "</p>"}</div></div>`;
}

function deltaChip(cur, prev, dir){
  if (cur === null || prev === null) return '<span class="chip none">no comparison</span>';
  if (prev === 0 && cur === 0)      return '<span class="chip flat">' + DOT_FLAT + ' no change</span>';
  /* A prior period of zero has no percentage baseline — dividing by it would
     read as infinite growth. The absolute change on the line below carries the
     magnitude instead, so this must not claim "no prior data" while the same
     card shows "prev $0". */
  if (prev === 0){
    const tone = dir === "down" ? "bad" : dir === "up" ? "good" : "flat";
    return `<span class="chip ${tone}">${ARROW_UP} new</span>`;
  }
  const pct = (cur - prev) / Math.abs(prev) * 100;
  const rose = cur > prev, fell = cur < prev;
  let tone = "flat";
  if (dir === "up")   tone = rose ? "good" : fell ? "bad" : "flat";
  if (dir === "down") tone = fell ? "good" : rose ? "bad" : "flat";
  return `<span class="chip ${tone}">${rose ? ARROW_UP : fell ? ARROW_DOWN : DOT_FLAT} ${
    pct > 0 ? "+" : ""}${pct.toFixed(2)}%</span>`;
}
function absDelta(cur, prev, kind){
  if (cur === null || prev === null) return "";
  const d = cur - prev;
  return (d > 0 ? "+" : d < 0 ? "−" : "") + fmt(Math.abs(d), kind).replace("-","");
}
function kpiCard(def, A, B){
  const cur = A[def.key], prev = B ? B[def.key] : null;
  /* Revenue was never supplied, so anything derived from it is withheld. ROI is
     checked first because it needs both sides and revenue is the missing one. */
  if (REVENUE_KPI_KEYS.has(def.key) && !A.revenueKnown){
    return `<article class="kpi">
      <p class="kpi-title">${esc(def.title)}</p>
      <p class="kpi-value empty">${DASH}</p>
      <div class="kpi-foot"><span class="chip flat">${ICON_CLOCK} awaiting revenue data</span>
        <p class="kpi-prev">no revenue figures supplied yet</p></div></article>`;
  }
  if (MAIL_KPI_KEYS.has(def.key) && !A.costKnown){
    return `<article class="kpi">
      <p class="kpi-title">${esc(def.title)}</p>
      <p class="kpi-value empty">${DASH}</p>
      <div class="kpi-foot"><span class="chip flat">${ICON_CLOCK} awaiting mail data</span>
        <p class="kpi-prev">no piece count or cost on the Red Stone board</p></div></article>`;
  }
  if (COST_KPI_KEYS.has(def.key) && !A.costKnown){
    return `<article class="kpi">
      <p class="kpi-title">${esc(def.title)}</p>
      <p class="kpi-value empty">${DASH}</p>
      <div class="kpi-foot"><span class="chip flat">${ICON_CLOCK} awaiting costing</span>
        <p class="kpi-prev">no spend figure supplied for this selection</p></div></article>`;
  }
  return `<article class="kpi">
    <p class="kpi-title">${esc(def.title)}</p>
    <p class="kpi-value${cur === null ? " empty" : ""}">${fmt(cur, def.fmt)}</p>
    <div class="kpi-foot">${deltaChip(cur, prev, def.dir)}
      <p class="kpi-prev">prev ${fmt(prev, def.fmt)}${
        prev !== null && cur !== null ? " · " + absDelta(cur, prev, def.fmt) : ""}</p>
    </div></article>`;
}
function statTile(title, value, sub){
  return `<article class="kpi"><p class="kpi-title">${esc(title)}</p>
    <p class="kpi-value">${value}</p>
    ${sub ? `<p class="kpi-prev">${esc(sub)}</p>` : ""}</article>`;
}

/* =========================================================================
   8. CHARTS — hand-drawn SVG, no external library.
   ========================================================================= */

const tip = document.getElementById("tip");
let tipRAF = null;
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.opacity = "1"; tip.setAttribute("aria-hidden","false");
  if (tipRAF) cancelAnimationFrame(tipRAF);
  tipRAF = requestAnimationFrame(() => {
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 10;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (left < 8) left = 8;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  });
}
function hideTip(){ tip.style.opacity = "0"; tip.setAttribute("aria-hidden","true"); }
document.addEventListener("scroll", hideTip, true);

function niceStep(rough){
  if (!isFinite(rough) || rough <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(rough))), n = rough / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function axisScale(vals, ticks){
  ticks = ticks || 4;
  const clean = vals.filter(v => v !== null && isFinite(v));
  const hi = Math.max(...clean, 0), lo = Math.min(...clean, 0);
  if (hi === 0 && lo === 0) return {min:0, max:1, step:0.25};
  if (lo >= 0){ const step = niceStep(hi*1.08/ticks); return {min:0, max:step*ticks, step}; }
  const step = niceStep((hi-lo)*1.08/ticks);
  const min = Math.floor(lo/step)*step;
  let max = min + step*ticks;
  while (max < hi) max += step;
  return {min, max, step};
}
function tickValues(sc){
  const out = [], n = Math.round((sc.max - sc.min)/sc.step);
  for (let i = 0; i <= n; i++) out.push(sc.min + sc.step*i);
  return out;
}
const SVG_NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent){
  const n = document.createElementNS(SVG_NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function barPath(x,y,w,h,r){
  r = Math.min(r, w/2, h);
  if (h <= 0.6) return `M${x} ${y+h} h${w}`;
  return `M${x} ${y+h} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+w-r} Q${x+w} ${y} ${x+w} ${y+r} V${y+h} Z`;
}
const CHART_PAD = {t:16, r:14, b:30, l:52};
function axisFmt(v, kind){
  if (kind === "usd0" || kind === "usd2") return compactUSD(v);
  if (kind === "pct" || kind === "pct2")  return Math.round(v) + "%";
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v % 1000 === 0 ? 0 : 1) + "k";
  return String(Math.round(v));
}
function emptyChart(host, msg, height){
  const W = Math.max(host.clientWidth || 520, 300), H = height || 210;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":msg}, host);
  el("rect", {x:1,y:1,width:W-2,height:H-2,rx:8,fill:"var(--surface-2)",
    stroke:"var(--rule-soft)","stroke-dasharray":"4 4"}, svg);
  const t = el("text", {x:W/2,y:H/2-2,"text-anchor":"middle",fill:"var(--ink-3)","font-size":13}, svg);
  t.textContent = msg;
  const t2 = el("text", {x:W/2,y:H/2+18,"text-anchor":"middle",fill:"var(--ink-3)","font-size":11.5}, svg);
  t2.textContent = "nothing plotted — this is not a value of zero";
  return svg;
}
const allNull = s => s.every(x => x.values.every(v => v === null));

function columnChart(host, opts){
  const {labels, series, kind="int", highlight=-1, height=210} = opts;
  if (allNull(series)) return emptyChart(host, opts.emptyMsg || "No data to plot", height);
  const W = Math.max(host.clientWidth || 520, 300), H = height, p = CHART_PAD;
  const innerW = W-p.l-p.r, innerH = H-p.t-p.b;
  const sc = axisScale(series.flatMap(s => s.values));
  const span = sc.max - sc.min || 1;
  const yOf = v => p.t + innerH - (v - sc.min)/span*innerH;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria||"chart"}, host);
  tickValues(sc).forEach(v => {
    const y = yOf(v);
    el("line", {x1:p.l,x2:W-p.r,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}, svg);
    const t = el("text", {x:p.l-9,y:y+4,"text-anchor":"end",fill:"var(--ink-3)",
      "font-size":11,"font-family":"var(--mono)"}, svg);
    t.textContent = axisFmt(v, kind);
  });
  const zeroY = yOf(Math.max(sc.min,0));
  el("line", {x1:p.l,x2:W-p.r,y1:zeroY,y2:zeroY,stroke:"var(--axis)","stroke-width":1}, svg);
  const n = labels.length, slot = innerW/n;
  const groupW = Math.min(slot*0.66, 46), gap = 2;
  const barW = series.length > 1 ? Math.max(3,(groupW-gap*(series.length-1))/series.length) : groupW;
  labels.forEach((lab,i) => {
    const gx = p.l + slot*i + (slot-groupW)/2;
    if (i === highlight)
      el("rect", {x:p.l+slot*i+1,y:p.t-6,width:slot-2,height:innerH+8,fill:"#eff4fa",rx:6}, svg);
    series.forEach((s,si) => {
      const v = s.values[i];
      if (v === null) return;
      const x = gx + si*(barW+gap), y1 = yOf(v);
      const top = Math.min(zeroY,y1), h = Math.abs(y1-zeroY);
      const path = el("path", {d:barPath(x,top,barW,h,4), fill:s.color,
        opacity: highlight === -1 || i === highlight ? 1 : .55}, svg);
      path.addEventListener("mouseenter", ev => showTip(
        `<div class="tip-t">${esc(lab)}</div>` + series.map(ss => ss.values[i] === null ? "" :
          `<div class="tip-r"><i style="background:${ss.color}"></i>${esc(ss.name)}<b>${fmt(ss.values[i],kind)}</b></div>`
        ).join(""), ev.clientX, ev.clientY));
      path.addEventListener("mousemove", ev => showTip(tip.innerHTML, ev.clientX, ev.clientY));
      path.addEventListener("mouseleave", hideTip);
    });
    const thin = n > 8 && innerW/n < 46;
    if (!thin || i % 2 === 0 || i === highlight){
      const t = el("text", {x:p.l+slot*i+slot/2,y:H-10,"text-anchor":"middle",
        fill: i === highlight ? "var(--ink)" : "var(--ink-3)","font-size":11,
        "font-weight": i === highlight ? 700 : 400}, svg);
      t.textContent = lab;
    }
  });
  if (highlight >= 0 && series.length === 1 && series[0].values[highlight] !== null){
    const v = series[0].values[highlight];
    const t = el("text", {x:p.l+slot*highlight+slot/2,y:yOf(v)-8,"text-anchor":"middle",
      fill:"var(--ink)","font-size":12,"font-weight":700}, svg);
    t.textContent = fmt(v, kind);
  }
  return svg;
}

function lineChart(host, opts){
  const {labels, series, kind="int", height=210, highlight=-1} = opts;
  if (allNull(series)) return emptyChart(host, opts.emptyMsg || "No data to plot", height);
  const W = Math.max(host.clientWidth || 520, 300), H = height, p = CHART_PAD;
  const innerW = W-p.l-p.r, innerH = H-p.t-p.b;
  const sc = axisScale(series.flatMap(s => s.values));
  const span = sc.max - sc.min || 1, n = labels.length;
  const xOf = i => p.l + (n === 1 ? innerW/2 : innerW*i/(n-1));
  const yOf = v => p.t + innerH - (v - sc.min)/span*innerH;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria||"trend"}, host);
  tickValues(sc).forEach(v => {
    const y = yOf(v);
    el("line", {x1:p.l,x2:W-p.r,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}, svg);
    const t = el("text", {x:p.l-9,y:y+4,"text-anchor":"end",fill:"var(--ink-3)",
      "font-size":11,"font-family":"var(--mono)"}, svg);
    t.textContent = axisFmt(v, kind);
  });
  if (sc.min < 0)
    el("line", {x1:p.l,x2:W-p.r,y1:yOf(0),y2:yOf(0),stroke:"var(--axis)",
      "stroke-width":1,"stroke-dasharray":"3 3"}, svg);
  series.forEach(s => {
    let d = "", open = false;
    s.values.forEach((v,i) => {
      if (v === null){ open = false; return; }
      d += (open ? " L" : " M") + xOf(i) + " " + yOf(v); open = true;
    });
    if (d) el("path", {d:d.trim(),fill:"none",stroke:s.color,"stroke-width":2,
      "stroke-linejoin":"round","stroke-linecap":"round"}, svg);
    const last = s.values.reduce((a,v,i) => v !== null ? i : a, -1);
    if (last >= 0) el("circle", {cx:xOf(last),cy:yOf(s.values[last]),r:4.5,fill:s.color,
      stroke:"var(--surface)","stroke-width":2}, svg);
  });
  labels.forEach((lab,i) => {
    const thin = n > 8 && innerW/n < 46;
    if (!thin || i % 2 === 0 || i === highlight){
      const t = el("text", {x:xOf(i),y:H-10,"text-anchor":"middle",
        fill: i === highlight ? "var(--ink)" : "var(--ink-3)","font-size":11,
        "font-weight": i === highlight ? 700 : 400}, svg);
      t.textContent = lab;
    }
  });
  const cross = el("line", {y1:p.t,y2:p.t+innerH,stroke:"var(--axis)","stroke-width":1,opacity:0}, svg);
  const dots = series.map(s => el("circle", {r:5,fill:s.color,stroke:"var(--surface)",
    "stroke-width":2,opacity:0}, svg));
  const hit = el("rect", {x:p.l,y:p.t,width:innerW,height:innerH,fill:"transparent"}, svg);
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX - box.left)/box.width*W;
    let i = Math.round((rel - p.l)/(innerW/Math.max(1,n-1)));
    i = Math.max(0, Math.min(n-1, i));
    if (series.every(s => s.values[i] === null)){
      hideTip(); cross.setAttribute("opacity",0); dots.forEach(d => d.setAttribute("opacity",0)); return;
    }
    cross.setAttribute("x1",xOf(i)); cross.setAttribute("x2",xOf(i)); cross.setAttribute("opacity",1);
    series.forEach((s,si) => {
      if (s.values[i] === null){ dots[si].setAttribute("opacity",0); return; }
      dots[si].setAttribute("cx",xOf(i)); dots[si].setAttribute("cy",yOf(s.values[i]));
      dots[si].setAttribute("opacity",1);
    });
    showTip(`<div class="tip-t">${esc(labels[i])}</div>` + series.map(s => s.values[i] === null ? "" :
      `<div class="tip-r"><i style="background:${s.color}"></i>${esc(s.name)}<b>${fmt(s.values[i],kind)}</b></div>`
    ).join(""), ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => {
    hideTip(); cross.setAttribute("opacity",0); dots.forEach(d => d.setAttribute("opacity",0));
  });
  return svg;
}

function barsH(host, opts){
  const {rows, kind="int"} = opts;
  const rowH = 26, padT = 6, padB = 6, labelW = opts.labelW || 200, valueW = 68;
  const W = Math.max(host.clientWidth || 520, 300);
  const H = rows.length*rowH + padT + padB;
  const trackX = labelW + 8, trackW = Math.max(40, W - trackX - valueW - 6);
  const max = axisScale(rows.map(r => r.value)).max;
  host.innerHTML = "";
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria||"ranking"}, host);
  rows.forEach((r,i) => {
    const y = padT + i*rowH;
    const t = el("text", {x:labelW,y:y+rowH/2+4,"text-anchor":"end",fill:"var(--ink-2)","font-size":12}, svg);
    t.textContent = r.label;
    el("rect", {x:trackX,y:y+5,width:trackW,height:rowH-14,fill:"#f0f3f7",rx:4}, svg);
    const w = max ? Math.max(r.value > 0 ? 3 : 0, r.value/max*trackW) : 0;
    if (w > 0){
      const bar = el("rect", {x:trackX,y:y+5,width:w,height:rowH-14,
        fill:r.color || "var(--s1)",rx:4}, svg);
      bar.addEventListener("mouseenter", ev => showTip(
        `<div class="tip-t">${esc(r.label)}</div><div class="tip-r"><i style="background:${
          r.color||"var(--s1)"}"></i>${esc(opts.measure||"Value")}<b>${fmt(r.value,kind)}</b></div>`,
        ev.clientX, ev.clientY));
      bar.addEventListener("mousemove", ev => showTip(tip.innerHTML, ev.clientX, ev.clientY));
      bar.addEventListener("mouseleave", hideTip);
    }
    const vt = el("text", {x:W-4,y:y+rowH/2+4,"text-anchor":"end",fill:"var(--ink)",
      "font-size":12,"font-weight":600,"font-family":"var(--mono)"}, svg);
    vt.textContent = fmt(r.value, kind);
  });
  return svg;
}

const CHART_REGISTRY = [];

function monthlySeries(master, leaf){
  return MONTHS.filter(mo => mo.y === REPORT_YEAR).map(mo => {
    const r = {from:startOfMonth(mo.y,mo.m), to:endOfMonth(mo.y,mo.m)};
    const a = aggregate(r, master, leaf);
    return {label:MONTH_NAMES[mo.m].slice(0,3), agg:a,
            hasData:a.leads > 0 || a.calls > 0 || a.spend > 0};
  });
}
const seriesVals = (ms, fn) => ms.map(m => m.hasData ? fn(m.agg) : null);
function highlightIndex(){
  if (state.month === "All Months") return -1;
  const [y,m] = state.month.split("-").map(Number);
  return y === REPORT_YEAR ? m-1 : -1;
}

function wireFilters(){

/* ---- Dashboard ----
   The dashboard shows ONE set of numbers: whatever the filters select. The
   direct-mail format cards only appear when the selection is direct mail, so
   picking a PPC or Referral source does not leave postcard and check figures
   sitting underneath it. */

function kpiHeading(){
  if (state.master === ALL_MASTERS) return "Company KPIs — all sources";
  if (state.master === NEEDS_REVIEW) return "Unclassified leads";
  if (state.leaf !== ALL_LEAF && hasChoice(state.master)) return state.leaf;
  return state.master;
}
function kpiSubheading(){
  if (state.master === ALL_MASTERS)
    return "Every source combined, including leads the campaign could not classify.";
  if (state.master === NEEDS_REVIEW)
    return "Leads whose campaign could not settle a Standard CRM Source.";
  if (state.leaf !== ALL_LEAF && hasChoice(state.master))
    return "This Standard CRM Source only, inside " + state.master + ".";
  return "All Standard CRM Sources inside " + state.master + " combined.";
}

/* Which mail-format blocks belong on screen for the current selection. */
function mailSection(cur, prevR){
  if (state.master !== "Direct Mail") return "";

  const render = (heading, scopeLeaf, cards, missingNote) => {
    const a = aggregate(cur, "Direct Mail", scopeLeaf);
    const b = prevR ? aggregate(prevR, "Direct Mail", scopeLeaf) : null;
    return `<div class="sec" style="margin:18px 0 8px">
        <h2 style="font-size:13.5px">${esc(heading)}</h2>
        ${missingNote ? `<p style="color:var(--warn-ink)">${esc(missingNote)}</p>` : ""}</div>
      <div class="kpi-grid">${cards.map(d => kpiCard(d,a,b)).join("")}</div>`;
  };

  /* One specific format selected — show only that format. */
  if (state.leaf !== ALL_LEAF){
    const g = MAIL_CARDS.find(x => x.leaf === state.leaf);
    if (!g) return "";
    return `<div class="sec"><h2>Mail performance</h2>
        <p>Piece counts and cost come from the Red Stone board.</p></div>` +
      render(g.heading, g.leaf, g.cards,
        leafCosted(g.leaf) ? "" : "no piece count or cost on the Red Stone board for this format");
  }

  /* Whole channel selected — every format, then the combined views. */
  return `<div class="sec"><h2>Mail performance by format</h2>
      <p>Each card names the format it measures. Piece counts and cost come from the
         Red Stone board.</p></div>` +
    MAIL_CARDS.map(g => render(g.heading, g.leaf, g.cards,
      leafCosted(g.leaf) ? "" : "no piece count or cost on the Red Stone board for this format")).join("") +
    MAIL_COMBINED.map(g => {
      const missing = g.leaves.filter(l => !leafCosted(l));
      return render(g.heading, g.leaves, g.cards, missing.length
        ? "withheld — " + missing.join(" and ") + (missing.length===1?" has":" have") + " no mail data"
        : "");
    }).join("");
}

    ALL_LEAVES.forEach(l => rows.push(Object.assign(
      {label:l, master:MASTER_OF[l], leaf:l, isMaster:false}, aggregate(cur, MASTER_OF[l], l))));
    rows.push(Object.assign({label:NEEDS_REVIEW, master:NEEDS_REVIEW, leaf:null, isReview:true},
      aggregate(cur, NEEDS_REVIEW, null)));
  }
  if (q) rows = rows.filter(r => r.label.toLowerCase().includes(q) ||
                                 (r.master||"").toLowerCase().includes(q));
  const {col,dir} = state.srcSort;
  rows.sort((a,b) => {
    const av = a[col], bv = b[col];
    if (typeof av === "string") return av.localeCompare(bv)*dir;
    return ((av === null ? -Infinity : av) - (bv === null ? -Infinity : bv))*dir;
  });
  return rows;
}

function sourceTable(){
  const rows = srcRows();
  const totals = aggregate(currentRange(), ALL_MASTERS, ALL_LEAF);
  const head = SRC_COLS.map(c => {
    const active = state.srcSort.col === c.key;
    return `<th class="sortable${c.l?" l":""}" data-col="${c.key}"${
      active ? ` aria-sort="${state.srcSort.dir===1?"ascending":"descending"}"` : ""}>${
      esc(c.label)} <span class="arrow">${active ? (state.srcSort.dir===1?"▲":"▼") : "▾"}</span></th>`;
  }).join("");

  const cell = (r,c) => {
    if (c.key === "label"){
      const dot = r.isReview ? "var(--warn)" : leafCosted(r.leaf) || (r.isMaster &&
        (TAXONOMY[r.master]||[]).every(leafCosted)) ? "var(--s1)" : "var(--ink-3)";
      return `<td class="l${!r.isMaster && state.srcView==="leaf" ? " indent" : ""}">
        <span class="src-cell"><i style="background:${dot}"></i>${esc(r.label)}</span>
        ${!r.isMaster && state.srcView==="leaf" ? "" : ""}</td>`;
    }
    if (REVENUE_KPI_KEYS.has(c.key) && !r.revenueKnown)
      return `<td title="awaiting revenue data" style="color:var(--ink-3)">${DASH}</td>`;
    if (COST_KPI_KEYS.has(c.key) && !r.costKnown)
      return `<td title="awaiting costing" style="color:var(--ink-3)">${DASH}</td>`;
    const v = r[c.key];
    const cls = c.key === "roi" && v !== null ? (v >= 0 ? "pos" : "neg") : "";
    return `<td class="${cls}">${fmt(v, c.fmt)}</td>`;
  };

  const body = rows.map(r => `<tr class="clickable${r.isMaster && state.srcView==="master" ? "" : ""}"
    data-master="${esc(r.master)}" data-leaf="${esc(r.leaf||"")}">${
    SRC_COLS.map(c => cell(r,c)).join("")}</tr>`).join("");

  const totalRow = `<tr class="total">${SRC_COLS.map(c => {
    if (c.key === "label") return `<td class="l">All Sources</td>`;
    if (REVENUE_KPI_KEYS.has(c.key) && !totals.revenueKnown)
      return `<td title="awaiting revenue data" style="color:var(--ink-3);font-weight:400">${DASH}</td>`;
    if (COST_KPI_KEYS.has(c.key) && !totals.costKnown)
      return `<td title="no company total until every source has costing" style="color:var(--ink-3);font-weight:400">${DASH}</td>`;
    const v = totals[c.key];
    const cls = c.key === "roi" && v !== null ? (v >= 0 ? "pos" : "neg") : "";
    return `<td class="${cls}">${fmt(v, c.fmt)}</td>`;
  }).join("")}</tr>`;

  return `<div class="table-tools">
    <span class="seg">
      <button class="btn sm" id="vMaster" aria-pressed="${state.srcView==="master"}">Master Source</button>
      <button class="btn sm" id="vLeaf" aria-pressed="${state.srcView==="leaf"}">Standard CRM Source</button>
    </span>
    <input type="search" id="srcSearch" placeholder="Search source" value="${esc(state.srcQuery)}" aria-label="Search source">
    <button class="btn" id="srcExport" type="button">Export CSV</button>
    ${state.master !== ALL_MASTERS
      ? `<button class="btn" id="srcClear" type="button">Clear filter</button>` : ""}
    <span class="spacer"></span>
    <span style="font-size:13px;color:var(--ink-3)">${rows.length} row${rows.length===1?"":"s"} · ${esc(currentRange().label)}</span>
  </div>
  <div class="t-scroll"><table><thead><tr>${head}</tr></thead>
    <tbody>${body || `<tr><td colspan="${SRC_COLS.length}" style="text-align:center;color:var(--ink-3);padding:22px">No source matches that search.</td></tr>`}${
      rows.length ? totalRow : ""}</tbody></table></div>`;
}
function wireSourceTable(root){
  root.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (state.srcSort.col === col) state.srcSort.dir *= -1;
    else state.srcSort = {col, dir: col === "label" ? 1 : -1};
    render();
  }));
  root.querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click", () => {
    state.master = tr.dataset.master;
    state.leaf = tr.dataset.leaf || ALL_LEAF;
    state.page = "dashboard"; render();
  }));
  const s = root.querySelector("#srcSearch");
  if (s) s.addEventListener("input", e => {
    state.srcQuery = e.target.value; render();
    const again = document.getElementById("srcSearch");
    if (again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  });
  const vm = root.querySelector("#vMaster");
  if (vm) vm.addEventListener("click", () => { state.srcView = "master"; render(); });
  const vl = root.querySelector("#vLeaf");
  if (vl) vl.addEventListener("click", () => { state.srcView = "leaf"; render(); });
  const ex = root.querySelector("#srcExport");
  if (ex) ex.addEventListener("click", exportCSV);
  const cl = root.querySelector("#srcClear");
  if (cl) cl.addEventListener("click", () => {
    state.master = ALL_MASTERS; state.leaf = ALL_LEAF; render();
  });
}
function exportCSV(){
  const rows = srcRows();
  const lines = [["Master Source","Standard CRM Source"].concat(
    SRC_COLS.slice(1).map(c => c.label)).join(",")];
  rows.forEach(r => {
    const cells = [`"${r.master || ""}"`, `"${r.leaf || ""}"`].concat(
      SRC_COLS.slice(1).map(c => {
        if (COST_KPI_KEYS.has(c.key) && !r.costKnown) return "";
        const v = r[c.key];
        return v === null ? "" : Math.round(v * 100) / 100;
      })
    );
    lines.push(cells.join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "thb-source-performance-" +
    currentRange().label.replace(/\s+/g,"-").toLowerCase() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* =========================================================================
   11. RENDER
   ========================================================================= */

function render(){
  CHART_REGISTRY.length = 0;
  hideTip();
  const main = document.getElementById("main");
  switch(state.page){
    case "dashboard": main.innerHTML = pageDashboard(); break;
    case "source":    main.innerHTML = pageSource();    break;
    case "calls":     main.innerHTML = pageCalls();     break;
    case "deals":     main.innerHTML = pageDeals();     break;
    case "review":    main.innerHTML = pageReview();    break;
    case "sync":      main.innerHTML = pageSync();      break;
    case "admin":     main.innerHTML = pageAdmin();     break;
  }
  renderRail();
  wireFilters();

  if (state.page === "dashboard" || state.page === "source"){
    const holder = document.getElementById("srcTable");
    if (holder){ holder.innerHTML = sourceTable(); wireSourceTable(holder); }
  }
  if (state.page === "dashboard") drawDashboardCharts();
  if (state.page === "source"){
    const cur = currentRange();
    const rows = (state.srcView === "master"
      ? MASTERS.map(m => ({label:m, value:aggregate(cur,m,ALL_LEAF).leads}))
      : ALL_LEAVES.map(l => ({label:l, value:aggregate(cur,MASTER_OF[l],l).leads})))
      .concat([{label:NEEDS_REVIEW, value:aggregate(cur,NEEDS_REVIEW,null).leads, color:"var(--warn)"}])
      .sort((a,b) => b.value - a.value);
    mountChart("chRank", h => barsH(h,{rows,kind:"int",measure:"Leads",
      labelW: state.srcView === "master" ? 150 : 240, aria:"Leads by source"}));
  }
  if (state.page === "calls") drawCallsCharts();
  if (state.page === "review") wireReview(main);
}

/* Default to the most recent COMPLETE month: a part-month reads as a decline
   against a full prior month, which is a reporting artefact, not performance. */
(function initMonth(){
  const complete = MONTHS.filter(mo => mo.y === REPORT_YEAR && monthScale(mo) > 0 &&
                                       endOfMonth(mo.y,mo.m) < TODAY);
  const last = complete[complete.length-1];
  if (last) state.month = last.key;
})();

render();
</script>
